    const LearnerDashboard = ({ user, courses, assignments, modules, quizzes, progress, quizAttempts, certificates, onOpenCourse }) => {
      const myAssignments = assignments.filter((item) => item.email === user.email);
      const statuses = myAssignments.map((assignment) => {
        const course = courses.find((item) => item.id === assignment.courseId);
        if (!course) return null;
        return { assignment, course, status: courseStatusForUser({ user, course, modules, assignments, progress, quizzes, quizAttempts }) };
      }).filter(Boolean);
      const completed = statuses.filter((item) => item.status.completed).length;
      const essential = statuses.filter((item) => (item.assignment.assignmentType || item.course.type) === 'Essential');
      const desirable = statuses.filter((item) => (item.assignment.assignmentType || item.course.type) === 'Desirable');
      const progressPct = statuses.length ? Math.round(statuses.reduce((sum, item) => sum + item.status.progressPct, 0) / statuses.length) : 0;
      const bestQuizScore = quizAttempts.filter((item) => item.email === user.email).length
        ? Math.max(...quizAttempts.filter((item) => item.email === user.email).map((item) => item.score))
        : null;

      return (
        <div className="space-y-6">

          <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
            <StatCard label="Assigned Learning" value={statuses.length} />
            <StatCard label="Completed Courses" value={completed} tone="teal" />
            <StatCard label="Overall Progress" value={`${progressPct}%`} tone="amber" />
            <StatCard label="Best Quiz Score" value={bestQuizScore !== null ? `${bestQuizScore}%` : '—'} tone="slate" />
          </div>
          <div className="grid gap-6 xl:grid-cols-[1.1fr_0.9fr]">
            <Panel className="p-6">
              <div className="flex items-center justify-between gap-4">
                <div>
                  <h2 className="display-font text-2xl font-800 text-ink">Assigned Learning</h2>
                  <p className="mt-2 text-sm text-slatey">Only the courses assigned to this learner appear here.</p>
                </div>
                <Tag tone="blue">{statuses.length} Courses</Tag>
              </div>
              <div className="mt-5 space-y-4">
                {statuses.length === 0 ? (
                  <EmptyState title="Nothing assigned yet" text="Your HR and admin teams have not assigned any courses yet." />
                ) : statuses.map(({ assignment, course, status }) => (
                  <div key={assignment.id} className="rounded-[24px] border border-slate-100 bg-slate-50 p-5">
                    <div className="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
                      <div>
                        <div className="mb-3 flex flex-wrap gap-2">
                          <Tag tone={(assignment.assignmentType || course.type) === 'Essential' ? 'amber' : 'teal'}>{assignment.assignmentType || course.type}</Tag>
                          <Tag tone="blue">{course.trainingType}</Tag>
                          <Tag tone={status.completed ? 'green' : 'slate'}>{status.pendingLabel}</Tag>
                        </div>
                        <h3 className="display-font text-xl font-800 text-ink">{course.title}</h3>
                        <p className="mt-2 text-sm leading-6 text-slatey">{course.description || 'No description available.'}</p>
                      </div>
                      <div className="min-w-[140px]">
                        <div className="text-right text-sm text-slate-500">Due {fmtDate(assignment.dueDate)}</div>
                        <div className="mt-3"><ProgressBar value={status.progressPct} /></div>
                        <div className="mt-2 text-right text-xs text-slate-500">{status.completedModules}/{status.moduleCount} modules</div>
                      </div>
                    </div>
                    <div className="mt-5">
                      <Button onClick={() => onOpenCourse(course.id)}>Open Course</Button>
                    </div>
                  </div>
                ))}
              </div>
            </Panel>

            <div className="space-y-6">
              <Panel className="p-6">
                <h2 className="display-font text-2xl font-800 text-ink">Learning Mix</h2>
                <div className="mt-5 grid gap-4 sm:grid-cols-2">
                  <div className="rounded-[22px] bg-amber-50 p-5">
                    <div className="text-sm font-semibold text-amberish">Essential</div>
                    <div className="display-font mt-2 text-4xl font-800 text-amberish">{essential.length}</div>
                  </div>
                  <div className="rounded-[22px] bg-teal-50 p-5">
                    <div className="text-sm font-semibold text-tealish">Desirable</div>
                    <div className="display-font mt-2 text-4xl font-800 text-tealish">{desirable.length}</div>
                  </div>
                </div>
              </Panel>
              <Panel className="p-6">
                <h2 className="display-font text-2xl font-800 text-ink">Recognition</h2>
                <p className="mt-2 text-sm text-slatey">Badges and certificates unlock automatically after course completion.</p>
                <div className="mt-5 grid gap-3">
                  {certificates.filter((item) => item.email === user.email).length === 0 ? (
                    <div className="rounded-[22px] bg-slate-50 p-5 text-sm text-slatey">Complete your assigned learning to unlock badges and certificates.</div>
                  ) : certificates.filter((item) => item.email === user.email).map((item) => (
                    <div key={item.id} className="rounded-[22px] bg-emerald-50 p-5">
                      <div className="display-font text-lg font-800 text-emerald-800">{item.badgeTitle}</div>
                      <div className="mt-1 text-sm text-emerald-700">Certificate issued on {fmtDate(item.issuedAt)}</div>
                    </div>
                  ))}
                </div>
              </Panel>
            </div>
          </div>
        </div>
      );

    const LearnerCourses = ({ user, courses, assignments, modules, quizzes, progress, quizAttempts, onOpenCourse }) => {
      const [activeTab, setActiveTab] = useState('all');
      const myAssignments = assignments.filter((item) => item.email === user.email);
      const cards = myAssignments.map((assignment) => {
        const course = courses.find((item) => item.id === assignment.courseId);
        if (!course) return null;
        return { assignment, course, status: courseStatusForUser({ user, course, modules, assignments, progress, quizzes, quizAttempts }) };
      }).filter(Boolean);

      const tabs = [
        { id: 'all', label: 'All Courses', match: () => true, tone: 'slate' },
        { id: 'essential', label: 'Essential', match: ({ assignment, course }) => (assignment.assignmentType || course.type) === 'Essential', tone: 'amber' },
        { id: 'desirable', label: 'Desirable', match: ({ assignment, course }) => (assignment.assignmentType || course.type) === 'Desirable', tone: 'teal' },
        { id: 'behavioral', label: 'Behavioral', match: ({ course }) => course.trainingType === 'Behavioral', tone: 'blue' },
        { id: 'functional', label: 'Functional', match: ({ course }) => course.trainingType === 'Functional', tone: 'violet' },
      ];

      const tabCounts = tabs.reduce((acc, tab) => { acc[tab.id] = cards.filter(tab.match).length; return acc; }, {});
      const activeMatch = tabs.find((tab) => tab.id === activeTab) || tabs[0];
      const filteredCards = cards.filter(activeMatch.match);

      return (
        <div className="space-y-6">
          <SectionTitle title="My Courses" subtitle="Assigned learning, grouped by requirement type, with module completion and quiz visibility." />

          {cards.length > 0 && (
            <Panel className="p-3">
              <div className="flex flex-wrap gap-2">
                {tabs.map((tab) => {
                  const isActive = tab.id === activeTab;
                  const toneStyles = {
                    slate: isActive ? 'bg-slate-900 text-white shadow-soft' : 'text-slate-600 hover:bg-slate-50',
                    amber: isActive ? 'bg-amberish text-white shadow-soft' : 'text-amberish hover:bg-amber-50',
                    teal: isActive ? 'bg-tealish text-white shadow-soft' : 'text-tealish hover:bg-teal-50',
                    blue: isActive ? 'bg-brand text-white shadow-soft' : 'text-brand hover:bg-blue-50',
                    violet: isActive ? 'bg-violet-600 text-white shadow-soft' : 'text-violet-700 hover:bg-violet-50',
                  };
                  return (
                    <button
                      key={tab.id}
                      type="button"
                      onClick={() => setActiveTab(tab.id)}
                      className={`tab-pill flex items-center gap-2 rounded-2xl px-4 py-2.5 text-sm font-semibold ${toneStyles[tab.tone]}`}
                    >
                      <span>{tab.label}</span>
                      <span className={`rounded-full px-2 py-0.5 text-[11px] font-bold ${isActive ? 'bg-white/20 text-white' : 'bg-slate-100 text-slate-600'}`}>
                        {tabCounts[tab.id]}
                      </span>
                    </button>
                  );
                })}
              </div>
            </Panel>
          )}

          {cards.length === 0 ? (
            <EmptyState title="No assigned courses" text="Your assigned learning will appear here once admin creates an assignment." />
          ) : filteredCards.length === 0 ? (
            <EmptyState title={`No ${activeMatch.label.toLowerCase()} yet`} text="Switch tabs to see other course categories assigned to you." />
          ) : (
            <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
              {filteredCards.map(({ assignment, course, status }) => (
                <Panel key={assignment.id} className="group relative overflow-hidden p-6 transition hover:-translate-y-0.5 hover:shadow-float">
                  <div className={`absolute inset-x-0 top-0 h-1 ${(assignment.assignmentType || course.type) === 'Essential' ? 'bg-gradient-to-r from-amber-500 to-orange-500' : 'bg-gradient-to-r from-teal-500 to-emerald-500'}`} />
                  <div className="flex flex-wrap gap-2">
                    <Tag tone={(assignment.assignmentType || course.type) === 'Essential' ? 'amber' : 'teal'}>{assignment.assignmentType || course.type}</Tag>
                    <Tag tone="blue">{course.trainingType}</Tag>
                    <Tag tone="slate">{course.focusArea}</Tag>
                  </div>
                  <h3 className="display-font mt-4 text-2xl font-800 text-ink">{course.title}</h3>
                  <p className="mt-3 text-sm leading-6 text-slatey">{course.description || 'No description available.'}</p>
                  <div className="mt-5">
                    <ProgressBar value={status.progressPct} />
                    <div className="mt-2 flex items-center justify-between text-xs text-slate-500">
                      <span>{status.completedModules}/{status.moduleCount} modules completed</span>
                      <span>{status.progressPct}%</span>
                    </div>
                  </div>
                  <div className="mt-4 flex flex-wrap gap-2">
                    <Tag tone={status.completed ? 'green' : 'amber'}>{status.pendingLabel}</Tag>
                    <Tag tone="slate">Due {fmtDate(assignment.dueDate)}</Tag>
                  </div>
                  <div className="mt-6">
                    <Button onClick={() => onOpenCourse(course.id)}>Open Learning</Button>
                  </div>
                </Panel>
              ))}
            </div>
          )}

    const LearnerProgress = ({ user, courses, assignments, modules, quizzes, progress, quizAttempts, certificates }) => {
      const myAssignments = assignments.filter((item) => item.email === user.email);

      return (
        <div className="space-y-6">
          <SectionTitle title="Progress / Grades / Clearance" subtitle="Track module completion, progress percentage, quiz results, and final course clearance." />
          {myAssignments.length === 0 ? (
            <EmptyState title="No progress to show" text="Assigned courses will populate your progress and grades view." />
          ) : (
            <div className="space-y-4">
              {myAssignments.map((assignment) => {
                const course = courses.find((item) => item.id === assignment.courseId);
                if (!course) return null;
                const status = courseStatusForUser({ user, course, modules, assignments, progress, quizzes, quizAttempts });
                const relatedAttempts = quizAttempts.filter((item) => item.email === user.email && (
                  (item.scopeType === 'course' && item.scopeId === course.id) ||
                  (item.scopeType === 'module' && status.visibleModules.some((module) => module.id === item.scopeId))
                ));
                const bestScore = relatedAttempts.length ? Math.max(...relatedAttempts.map((item) => item.score)) : null;
                const certificate = certificates.find((item) => item.email === user.email && item.courseId === course.id);
                return (
                  <Panel key={assignment.id} className="p-6">
                    <div className="flex flex-col gap-4 xl:flex-row xl:items-start xl:justify-between">
                      <div>
                        <div className="mb-3 flex flex-wrap gap-2">
                          <Tag tone={course.type === 'Essential' ? 'amber' : 'teal'}>{course.type}</Tag>
                          <Tag tone="blue">{course.trainingType}</Tag>
                          <Tag tone={status.completed ? 'green' : 'slate'}>{status.pendingLabel}</Tag>
                        </div>
                        <h3 className="display-font text-2xl font-800 text-ink">{course.title}</h3>
                        <p className="mt-2 text-sm text-slatey">Focus: {course.focusArea}</p>
                      </div>
                      <div className="rounded-[22px] bg-slate-50 p-5 text-right">
                        <div className="display-font text-4xl font-800 text-ink">{status.progressPct}%</div>
                        <div className="mt-1 text-xs text-slate-500">Completion Progress</div>
                      </div>
                    </div>
                    <div className="mt-5">
                      <ProgressBar value={status.progressPct} />
                    </div>
                    <div className="mt-5 grid gap-4 md:grid-cols-2 xl:grid-cols-4">
                      <div className="rounded-[20px] bg-slate-50 p-4">
                        <div className="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Modules</div>
                        <div className="mt-2 text-lg font-semibold text-ink">{status.completedModules}/{status.moduleCount}</div>
                      </div>
                      <div className="rounded-[20px] bg-slate-50 p-4">
                        <div className="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Quiz Best</div>
                        <div className="mt-2 text-lg font-semibold text-ink">{bestScore !== null ? `${bestScore}%` : '—'}</div>
                      </div>
                      <div className="rounded-[20px] bg-slate-50 p-4">
                        <div className="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Clearance</div>
                        <div className="mt-2 text-lg font-semibold text-ink">{status.completed ? 'Cleared' : 'Pending'}</div>
                      </div>
                      <div className="rounded-[20px] bg-slate-50 p-4">
                        <div className="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Certificate</div>
                        <div className="mt-2 text-lg font-semibold text-ink">{certificate ? 'Issued' : 'Not yet'}</div>
                      </div>
                    </div>
                  </Panel>
                );
              })}
            </div>
          )}
        </div>
      );
    };

    const RecognitionHub = ({ viewer, courses, certificates }) => {
      const visibleCertificates = ['superadmin', 'admin', 'hr'].includes(viewer.role)
        ? certificates
        : certificates.filter((item) => item.email === viewer.email);

      return (
        <div className="space-y-6">
          <SectionTitle
            title="Certificates & Badges"
            subtitle="Recognition is automatically awarded after successful completion. Certificate cards also show the simulated email delivery status."
          />
          {visibleCertificates.length === 0 ? (
            <EmptyState title="No certificates issued yet" text="Complete training to unlock badges and generate downloadable certificates." />
          ) : (
            <div className="grid gap-4 xl:grid-cols-2">
              {visibleCertificates.map((certificate) => {
                const learnerName = certificate.learnerName;
                const course = courses.find((item) => item.id === certificate.courseId);
                return (
                  <Panel key={certificate.id} className="certificate-bg overflow-hidden">
                    <div className="h-2 bg-gradient-to-r from-brand via-tealish to-amberish" />
                    <div className="p-6">
                      <div className="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
                        <div>
                          <div className="flex flex-wrap gap-2">
                            <Tag tone="green">Badge Awarded</Tag>
                            <Tag tone="blue">Certificate Ready</Tag>
                          </div>
                          <h3 className="display-font mt-4 text-2xl font-800 text-ink">{certificate.badgeTitle}</h3>
                          <p className="mt-2 text-sm text-slatey">{learnerName} successfully completed {course?.title || 'this course'}.</p>
                        </div>
                        <div className="rounded-[22px] bg-white p-4 shadow-soft">
                          <div className="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Issued</div>
                          <div className="mt-2 text-sm font-semibold text-ink">{fmtDate(certificate.issuedAt)}</div>
                        </div>
                      </div>
                      <div className="mt-6 grid gap-4 md:grid-cols-2">
                        <div className="rounded-[22px] bg-white p-5 shadow-soft">
                          <div className="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Certificate Delivery</div>
                          <div className="mt-2 text-sm font-semibold text-ink">{certificate.emailStatus}</div>
                          <div className="mt-2 text-sm text-slatey">Sent to {certificate.email}</div>
                        </div>
                        <div className="rounded-[22px] bg-white p-5 shadow-soft">
                          <div className="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Recognition Note</div>
                          <div className="mt-2 text-sm text-slatey">This learner has completed the orientation or training course and earned the associated LMS badge.</div>
                        </div>
                      </div>
                      <div className="mt-6 flex flex-wrap gap-3">
                        <Button onClick={() => createPdfCertificate({ learner: { name: certificate.learnerName, employeeId: certificate.employeeId, email: certificate.email }, course: course || { title: certificate.courseTitle }, certificate })}>
                          Download PDF Certificate
                        </Button>
                        <Tag tone="teal">{certificate.courseType}</Tag>
                      </div>
                    </div>
                  </Panel>
                );
              })}
            </div>
          )}
        </div>
      );
    };

    const ProfilePage = ({ user }) => (
      <div className="space-y-6">
        <SectionTitle title="Profile" subtitle="Your employee profile and LMS access details." />
        <div className="grid gap-6 xl:grid-cols-[0.9fr_1.1fr]">
          <Panel className="p-8 text-center">
            <div className="mx-auto flex h-24 w-24 items-center justify-center rounded-[28px] bg-gradient-to-br from-brand to-tealish text-3xl font-bold text-white shadow-soft">
              {(user.name || '?')[0].toUpperCase()}
            </div>
            <h2 className="display-font mt-5 text-3xl font-800 text-ink">{user.name}</h2>
            <p className="mt-2 text-sm text-slatey">{user.email}</p>
            <div className="mt-4"><Tag tone={roleTone(user.role)}>{roleLabel(user.role)}</Tag></div>
          </Panel>
          <Panel className="p-8">
            <div className="grid gap-4 md:grid-cols-2">
              <div className="rounded-[22px] bg-slate-50 p-5"><div className="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Employee ID</div><div className="mt-2 text-lg font-semibold text-ink">{user.employeeId || '—'}</div></div>
              <div className="rounded-[22px] bg-slate-50 p-5"><div className="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Designation</div><div className="mt-2 text-lg font-semibold text-ink">{user.designation || '—'}</div></div>
              <div className="rounded-[22px] bg-slate-50 p-5"><div className="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Department</div><div className="mt-2 text-lg font-semibold text-ink">{user.department || '—'}</div></div>
              <div className="rounded-[22px] bg-slate-50 p-5"><div className="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Business Line</div><div className="mt-2 text-lg font-semibold text-ink">{businessLineLabel(user)}</div></div>
            </div>
          </Panel>
        </div>
      </div>
    );

    const App = () => {
      const searchParams = new URLSearchParams(window.location.search);
      const standaloneCourseId = searchParams.get('courseView') === '1' ? searchParams.get('courseId') : '';
      const [sessionEmail, setSessionEmail] = useState(null);
      const [authInitialized, setAuthInitialized] = useState(false);
      const dataEnabled = authInitialized && !!sessionEmail;
      const [users, setUsers, usersState] = useFirestoreCollection('users', [], dataEnabled);
      const [courses, setCourses, coursesState] = useFirestoreCollection('courses', [], dataEnabled);
      const [modules, setModules, modulesState] = useFirestoreCollection('modules', [], dataEnabled);
      const [assignments, setAssignments, assignmentsState] = useFirestoreCollection('assignments', [], dataEnabled);
      const [assignmentRules, setAssignmentRules, assignmentRulesState] = useFirestoreCollection('assignment_rules', [], dataEnabled);
      const [quizzes, setQuizzes, quizzesState] = useFirestoreCollection('quizzes', [], dataEnabled);
      const [progress, setProgress, progressState] = useFirestoreCollection('progress', [], dataEnabled);
      const [quizAttempts, setQuizAttempts, quizAttemptsState] = useFirestoreCollection('quiz_attempts', [], dataEnabled);
      const [certificates, setCertificates, certificatesState] = useFirestoreCollection('certificates', [], dataEnabled);
      const [view, setView] = useState('dashboard');
      const [navOpen, setNavOpen] = useState(false);
      const dataStates = [usersState, coursesState, modulesState, assignmentsState, assignmentRulesState, quizzesState, progressState, quizAttemptsState, certificatesState];
      const dataLoading = dataStates.some((state) => state.loading);
      const dataError = dataStates.map((state) => state.error).find(Boolean);
      const dataSaveError = dataStates.map((state) => state.saveError).find(Boolean);
      const [saveToast, setSaveToast] = useState('');
      useEffect(() => {
        if (!dataSaveError) return;
        setSaveToast(dataSaveError);
        const t = setTimeout(() => setSaveToast(''), 7000);
        return () => clearTimeout(t);
      }, [dataSaveError]);

      useEffect(() => {
        if (!window.__lmsAuth) { setAuthInitialized(true); return; }
        return window.__lmsAuth.onAuthStateChanged((user) => {
          setSessionEmail(user ? user.email : null);
          setAuthInitialized(true);
          if (!user) setView('dashboard');
        });
      }, []);

      useEffect(() => {
        const bootstrapExists = users.some((user) => user.email === SUPER_EMAIL);
        if (!bootstrapExists && sessionEmail === SUPER_EMAIL) {
          setUsers([
            ...users,
            {
              id: uid(),
              employeeId: 'ALS-ADM-001',
              name: slugName(SUPER_EMAIL),
              designation: 'LMS Super Admin',
              email: SUPER_EMAIL,
              department: 'Learning & Development',
              businessLine: BUSINESS_LINES[0],
              businessLineOther: '',
              role: 'superadmin',
              createdAt: Date.now(),
              createdBy: 'system',
            },
          ]);
        }
      }, [sessionEmail, users]);

      useEffect(() => {
        if (!users.length) return;
        const nextCertificates = [...certificates];
        let changed = false;
        users.filter((user) => user.role === 'learner').forEach((user) => {
          courses.forEach((course) => {
            const status = courseStatusForUser({ user, course, modules, assignments, progress, quizzes, quizAttempts });
            if (!status.assigned || !status.completed) return;
            const existing = nextCertificates.find((item) => item.email === user.email && item.courseId === course.id);
            if (!existing) {
              nextCertificates.push({
                id: uid(),
                email: user.email,
                learnerName: user.name,
                employeeId: user.employeeId,
                courseId: course.id,
                courseTitle: course.title,
                courseType: course.type,
                badgeTitle: `${course.title} Completion Badge`,
                issuedAt: Date.now(),
                emailStatus: `Certificate sent to ${user.email}`,
              });
              changed = true;
            }
          });
        });
        if (changed) setCertificates(nextCertificates);
      }, [users, courses, modules, assignments, progress, quizzes, quizAttempts]);

      const login = async () => {
        try {
          await window.__lmsAuth.signIn();
        } catch (err) {
          alert('Sign-in failed: ' + (err.message || 'Unknown error'));
        }
      };

      const createWithEmployeeId = (employeeId) => {
        if (users.some((u) => u.email === sessionEmail)) return;
        const newUser = {
          id: uid(),
          employeeId: clean(employeeId, 50),
          name: slugName(sessionEmail),
          designation: '',
          email: sessionEmail,
          department: '',
          businessLine: BUSINESS_LINES[0],
          businessLineOther: '',
          role: 'learner',
          createdAt: Date.now(),
          createdBy: 'google-signin',
        };
        const autoAssignments = assignmentRules
          .filter((rule) => ruleMatchesUser(rule, newUser))
          .filter((rule) => !assignments.some((a) => a.email === newUser.email && a.courseId === rule.courseId))
          .map((rule) => ({ id: uid(), email: newUser.email, courseId: rule.courseId, dueDate: rule.dueDate || '', assignedAt: Date.now(), source: `Rule: ${rule.name}` }));
        setUsers([...users, newUser]);
        if (autoAssignments.length) setAssignments([...assignments, ...autoAssignments]);
      };

      const createAccount = (form) => {
        const email = clean(form.email, 120).toLowerCase();
        if (!clean(form.employeeId, 50) || !clean(form.name, 120) || !clean(form.designation, 120) || !clean(form.department, 120)) {
          return { ok: false, message: 'Complete all employee fields before creating the account.' };
        }
        if (!EMAIL_RE.test(email)) {
          return { ok: false, message: 'Employee email must use the @equipment.ae company format.' };
        }
        if (form.businessLine === 'Other' && !clean(form.businessLineOther, 120)) {
          return { ok: false, message: 'Enter the business line name when selecting Other.' };
        }
        if (users.some((user) => user.email === email)) {
          return { ok: false, message: 'An account with this email already exists.' };
        }

        const user = {
          id: uid(),
          employeeId: clean(form.employeeId, 50),
          name: clean(form.name, 120),
          designation: clean(form.designation, 120),
          email,
          department: clean(form.department, 120),
          businessLine: form.businessLine,
          businessLineOther: form.businessLine === 'Other' ? clean(form.businessLineOther, 120) : '',
          role: 'learner',
          createdAt: Date.now(),
          createdBy: 'login-page',
        };

        const nextUsers = [...users, user];
        setUsers(nextUsers);

        const autoAssignments = assignmentRules
          .filter((rule) => ruleMatchesUser(rule, user))
          .filter((rule) => !assignments.some((item) => item.email === user.email && item.courseId === rule.courseId))
          .map((rule) => ({
            id: uid(),
            email: user.email,
            courseId: rule.courseId,
            dueDate: rule.dueDate || '',
            assignedAt: Date.now(),
            source: `Rule: ${rule.name}`,
          }));

        if (autoAssignments.length) {
          setAssignments([...assignments, ...autoAssignments]);
        }

        return { ok: true, message: `${user.name} was created successfully. You can sign in now.` };
      };

      const logout = () => {
        window.__lmsAuth?.signOut();
        setView('dashboard');
      };

      if (!authInitialized || (dataEnabled && dataLoading)) {
        return <LoadingScreen />;
      }

      if (!sessionEmail) {
        return <LoginPage onLogin={login} onCreateWithEmployeeId={createWithEmployeeId} pendingEmail={null} onSignOut={logout} />;
      }

      if (dataError) {
        return (
          <div className="page-shell flex min-h-screen items-center justify-center px-4">
            <Panel className="max-w-xl p-8">
              <Logo className="h-12" />
              <h1 className="display-font mt-6 text-2xl font-800 text-ink">Firebase data connection failed</h1>
              <p className="mt-3 text-sm leading-6 text-slatey">{dataError}</p>
              <p className="mt-4 text-sm text-slate-500">Check the Vercel environment variables and confirm Firebase is configured correctly.</p>
            </Panel>
          </div>
        );
      }

      const user = users.find((item) => item.email === sessionEmail);
      if (!user) {
        if (!EMAIL_RE.test(sessionEmail)) {
          return (
            <div className="page-shell flex min-h-screen items-center justify-center px-4">
              <Panel className="max-w-md p-8 text-center">
                <Logo className="mx-auto h-12" />
                <h1 className="display-font mt-6 text-xl font-800 text-ink">Access not permitted</h1>
                <p className="mt-3 text-sm text-slatey">Only @equipment.ae company accounts are allowed to access this LMS.</p>
                <button onClick={logout} className="mt-6 rounded-2xl bg-slate-100 px-5 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-200">Sign Out</button>
              </Panel>
            </div>
          );
        }
        return <LoginPage onLogin={login} onCreateWithEmployeeId={createWithEmployeeId} pendingEmail={sessionEmail} onSignOut={logout} />;
      }

      const adminLike = ['superadmin', 'admin', 'hr'].includes(user.role);
      const openCourseInNewTab = (courseId) => {
        window.open(makeCourseTabUrl(courseId), '_blank', 'noopener');
      };
      const progressSummary = {
        quizAttemptsByUser: quizAttempts.reduce((acc, attempt) => {
          if (!acc[attempt.email]) acc[attempt.email] = [];
          acc[attempt.email].push(attempt);
          return acc;
        }, {}),
      };

      const renderView = () => {
        if (view === 'profile') return <ProfilePage user={user} />;
        if (adminLike) {
          if (view === 'dashboard') return <AdminDashboard users={users} courses={courses} assignments={assignments} modules={modules} quizzes={quizzes} progress={progressSummary} certificates={certificates} />;
          if (view === 'participants') return <ParticipantManagement users={users} setUsers={setUsers} currentUser={user} />;
          if (view === 'course-mgmt') return <CourseManagement courses={courses} setCourses={setCourses} />;
          if (view === 'module-mgmt') return <ModuleManagement courses={courses} modules={modules} setModules={setModules} />;
          if (view === 'assignment-mgmt') return <AssignmentManagement users={users} courses={courses} assignments={assignments} setAssignments={setAssignments} assignmentRules={assignmentRules} setAssignmentRules={setAssignmentRules} />;
          if (view === 'quiz-mgmt') return <QuizManagement courses={courses} modules={modules} quizzes={quizzes} setQuizzes={setQuizzes} />;
          if (view === 'reports') return <Reports users={users} courses={courses} assignments={assignments} modules={modules} quizzes={quizzes} quizAttempts={quizAttempts} progress={progress} certificates={certificates} />;
          if (view === 'recognition') return <RecognitionHub viewer={user} courses={courses} certificates={certificates} />;
        }
        if (view === 'dashboard') return <LearnerDashboard user={user} courses={courses} assignments={assignments} modules={modules} quizzes={quizzes} progress={progress} quizAttempts={quizAttempts} certificates={certificates} onOpenCourse={openCourseInNewTab} />;
        if (view === 'my-courses') return <LearnerCourses user={user} courses={courses} assignments={assignments} modules={modules} quizzes={quizzes} progress={progress} quizAttempts={quizAttempts} onOpenCourse={openCourseInNewTab} />;
        if (view === 'progress') return <LearnerProgress user={user} courses={courses} assignments={assignments} modules={modules} quizzes={quizzes} progress={progress} quizAttempts={quizAttempts} certificates={certificates} />;
        if (view === 'recognition') return <RecognitionHub viewer={user} courses={courses} certificates={certificates} />;
        return <ProfilePage user={user} />;
      };

      if (standaloneCourseId) {
        const standaloneCourse = courses.find((course) => course.id === standaloneCourseId);
        if (standaloneCourse) {
          return (
            <CourseDetailPage
              user={user}
              course={standaloneCourse}
              modules={modules}
              quizzes={quizzes}
              assignments={assignments}
              progress={progress}
              setProgress={setProgress}
              quizAttempts={quizAttempts}
              setQuizAttempts={setQuizAttempts}
            />
          );
        }
      }

      return (
        <div className="page-shell min-h-screen">
          <Header user={user} onToggleNav={() => setNavOpen((prev) => !prev)} onLogout={logout} onProfile={() => setView('profile')} />
          {saveToast && (
            <div className="fixed bottom-5 right-5 z-50 flex max-w-sm items-start gap-3 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 shadow-lg">
              <span className="flex-1 text-sm text-red-700">Save failed: {saveToast}</span>
              <button onClick={() => setSaveToast('')} className="text-red-400 hover:text-red-600 text-lg leading-none font-bold">&times;</button>
            </div>
          )}
          <div className="mx-auto flex max-w-[1600px] gap-6 px-4 py-6 md:px-6">
            <Sidebar role={user.role} view={view} setView={setView} open={navOpen} setOpen={setNavOpen} />
            <main className="min-w-0 flex-1">
              {renderView()}
            </main>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
