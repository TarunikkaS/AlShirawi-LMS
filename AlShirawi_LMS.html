          documents: [],
          images: [],
        });
        setPendingDocs([]);
        setPendingImages([]);
        setVideoUploadInfo(null);
        setError('');
      };

      const openEdit = (module) => {
        setEditing(module);
        setForm({
          ...module,
          applicability: module.applicability || { designationKeyword: '', departmentKeyword: '', businessLines: [] },
          documents: module.documents || [],
          images: module.images || [],
        });
        setPendingDocs([]);
        setPendingImages([]);
        setVideoUploadInfo(isUploadedVideoUrl(module.videoUrl) ? { name: 'Uploaded video file', size: 0 } : null);
        setError('');
      };

      const removeAsset = (field, id) => setForm((prev) => ({ ...prev, [field]: (prev[field] || []).filter((item) => item.id !== id) }));
      const removePendingImage = (id) => setPendingImages((prev) => prev.filter((entry) => entry.id !== id));
      const removePendingDoc = (id) => setPendingDocs((prev) => prev.filter((entry) => entry.id !== id));
      const onDocFileChange = (files) => {
        const incoming = Array.from(files || []);
        if (docInputRef.current) docInputRef.current.value = '';
        if (!incoming.length) return;
        const room = MAX_MODULE_DOCS - ((form.documents || []).length + pendingDocs.length);
        if (room <= 0) {
          setError(`You can attach a maximum of ${MAX_MODULE_DOCS} documents per module.`);
          return;
        }
        const additions = incoming.slice(0, room).map((file) => ({ id: uid(), file }));
        if (incoming.length > room) {
          const skipped = incoming.length - room;
          setError(`Only ${room} more document${room === 1 ? '' : 's'} could be added (max ${MAX_MODULE_DOCS}). ${skipped} file${skipped === 1 ? '' : 's'} skipped.`);
        } else {
          setError('');
        }
        setPendingDocs((prev) => [...prev, ...additions]);
      };
      const onImageFileChange = (files) => {
        const additions = Array.from(files || []).map((file) => ({
          id: uid(),
          file,
          label: file.name.replace(/\.[^/.]+$/, ''),
        }));
        if (!additions.length) return;
        setPendingImages((prev) => [...prev, ...additions]);
        if (imageInputRef.current) imageInputRef.current.value = '';
      };
      const updatePendingImageLabel = (id, value) => {
        setPendingImages((prev) => prev.map((entry) => entry.id === id ? { ...entry, label: value } : entry));
      };

      const onVideoFileChange = async (files) => {
        const file = (files || [])[0];
        if (!file) return;
        if (!/^video\//i.test(file.type) && !/\.(mp4|webm|ogg|mov|m4v)$/i.test(file.name)) {
          setError('Please choose a valid video file (mp4, webm, mov, etc.).');
          return;
        }
        setError('');
        setVideoUploading(true);
        try {
          const publicUrl = await uploadFileToStorage(file, 'module-videos');
          setForm((prev) => ({ ...prev, videoUrl: publicUrl }));
          setVideoUploadInfo({ name: file.name, size: file.size });
        } catch (err) {
          setError(err.message || 'The video could not be uploaded.');
        } finally {
          setVideoUploading(false);
          if (videoInputRef.current) videoInputRef.current.value = '';
        }
      };

      const clearUploadedVideo = () => {
        setVideoUploadInfo(null);
        setForm((prev) => ({ ...prev, videoUrl: isUploadedVideoUrl(prev.videoUrl) ? '' : prev.videoUrl }));
        if (videoInputRef.current) videoInputRef.current.value = '';
      };

      const save = async () => {
        if (!form.courseId || !clean(form.title, 160)) {
          setError('Select a course and enter a module title.');
          return;
        }
        try {
          const docs = await readFilesAsDataUrls(pendingDocs.map((entry) => entry.file));
          const images = await readLabeledImagesAsDataUrls(pendingImages);
          const payload = {
            id: editing.id || uid(),
            courseId: form.courseId,
            title: clean(form.title, 160),
            description: clean(form.description, 700),
            order: Number(form.order) || 1,
            videoUrl: isUploadedVideoUrl(form.videoUrl) ? form.videoUrl : clean(form.videoUrl, 400),
            notes: clean(form.notes, 4000),
            applicability: {
              designationKeyword: clean(form.applicability.designationKeyword, 80),
              departmentKeyword: clean(form.applicability.departmentKeyword, 80),
              businessLines: form.applicability.businessLines || [],
            },
            documents: [...(form.documents || []), ...docs].slice(0, MAX_MODULE_DOCS),
            images: [...(form.images || []), ...images],
            createdAt: editing.createdAt || Date.now(),
          };
          const next = editing.id ? modules.map((module) => module.id === editing.id ? payload : module) : [...modules, payload];
          setModules(next);
          setEditing(null);
        } catch (err) {
          setError(err.message || 'One or more files could not be processed.');
        }
      };

      const remove = (id) => {
        if (!window.confirm('Delete this module?')) return;
        setModules(modules.filter((module) => module.id !== id));
      };

      const generateImage = async () => {
        const kw = imgGenKeyword.trim();
        if (!kw) { setImgGenError('Enter a keyword first.'); return; }
        setImgGenLoading(true);
        setImgGenError('');
        try {
          const res = await fetch('/api/fetch-image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${await getToken() || ''}` },
            body: JSON.stringify({ keyword: kw, label: imgGenLabel.trim() || kw }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Image fetch failed.');
          setForm((prev) => ({ ...prev, images: [...(prev.images || []), data.image] }));
          setImgGenKeyword('');
          setImgGenLabel('');
        } catch (err) {
          setImgGenError(err.message || 'Could not fetch image.');
        } finally {
          setImgGenLoading(false);
        }
      };

      const openAI = () => {
        setAiOpen(true);
        setAiCourseId(courses[0]?.id || '');
        setAiCount(5);
        setAiResult(null);
        setAiError('');
      };

      const generateModules = async () => {
        const course = courses.find((c) => c.id === aiCourseId);
        if (!course) { setAiError('Select a course first.'); return; }
        setAiGenerating(true);
        setAiError('');
        setAiResult(null);
        try {
          const res = await fetch('/api/generate-modules', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${await getToken() || ''}` },
            body: JSON.stringify({
              courseTitle: course.title,
              courseDescription: course.description,
              courseType: course.type,
              trainingType: course.trainingType,
              focusArea: course.focusArea,
              numModules: aiCount,
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Generation failed.');
          setAiResult(data.modules);
        } catch (err) {
          setAiError(err.message || 'Something went wrong. Try again.');
        } finally {
          setAiGenerating(false);
        }
      };

      const addGeneratedModules = () => {
        if (!aiResult || !aiCourseId) return;
        const existing = modules.filter((m) => m.courseId === aiCourseId);
        const existingTitles = new Set(existing.map((m) => m.title.trim().toLowerCase()));
        const toAdd = aiResult.filter((mod) => !existingTitles.has((mod.title || '').trim().toLowerCase()));
        if (!toAdd.length) return;
        const newModules = toAdd.map((mod, i) => ({
          id: uid(),
          courseId: aiCourseId,
          title: mod.title,
          description: mod.description,
          order: existing.length + i + 1,
          videoUrl: '',
          notes: mod.notes || '',
          applicability: { designationKeyword: '', departmentKeyword: '', businessLines: [] },
          documents: [],
          images: mod.images || [],
          createdAt: Date.now(),
        }));
        setModules([...modules, ...newModules]);
        setAiOpen(false);
        setAiResult(null);
      };

      return (
        <div className="space-y-6">
          <SectionTitle
            title="Module Management"
            subtitle="Add videos, documents, pictures, notes, and profile-based module applicability inside each course."
            action={
              <div className="flex gap-2">
                <Button variant="soft" tone="slate" onClick={openAI} disabled={courses.length === 0}>✦ Generate with AI</Button>
                <Button onClick={openNew} disabled={courses.length === 0}>Add Module</Button>
              </div>
            }
          />
          {courses.length === 0 && <Panel className="p-6 text-sm text-slatey">Create at least one course before adding modules.</Panel>}
          <div className="grid gap-4">
            {modules.length === 0 ? (
              <EmptyState title="No modules created" text="Modules will hold videos, resources, and the learner-facing training content experience." />
            ) : (
              modules
                .slice()
                .sort((a, b) => (a.order || 0) - (b.order || 0))
                .map((module) => {
                  const course = courses.find((item) => item.id === module.courseId);
                  return (
                    <Panel key={module.id} className="p-6">
                      <div className="flex flex-col gap-4 xl:flex-row xl:items-start xl:justify-between">
                        <div>
                          <div className="mb-3 flex flex-wrap gap-2">
                            <Tag tone="blue">Module #{module.order}</Tag>
                            <Tag tone="teal">{course?.title || 'Unknown Course'}</Tag>
                            {module.videoUrl && <Tag tone="amber">Video</Tag>}
                            {(module.documents || []).length > 0 && <Tag tone="slate">{module.documents.length} Documents</Tag>}
                            {(module.images || []).length > 0 && <Tag tone="slate">{module.images.length} Images</Tag>}
                          </div>
                          <h3 className="display-font text-2xl font-800 text-ink">{module.title}</h3>
                          <p className="mt-2 text-sm leading-6 text-slatey">{module.description || 'No module description added yet.'}</p>
                          <div className="mt-4 flex flex-wrap gap-2">
                            {(module.applicability?.businessLines || []).map((item) => <Tag key={item} tone="teal">{item}</Tag>)}
                            {module.applicability?.designationKeyword && <Tag tone="slate">Designation: {module.applicability.designationKeyword}</Tag>}
                            {module.applicability?.departmentKeyword && <Tag tone="slate">Department: {module.applicability.departmentKeyword}</Tag>}
                            {!(module.applicability?.businessLines || []).length && !module.applicability?.designationKeyword && !module.applicability?.departmentKeyword && (
                              <Tag tone="green">Visible to all assigned learners</Tag>
                            )}
                          </div>
                        </div>
                        <div className="flex gap-3">
                          <Button variant="soft" onClick={() => openEdit(module)}>Edit</Button>
                          <Button variant="soft" tone="danger" onClick={() => remove(module.id)}>Delete</Button>
                        </div>
                      </div>
                    </Panel>
                  );
                })
            )}
          </div>

          {aiOpen && (
            <Modal
              title="Generate Modules with AI"
              subtitle="Let AI create a module outline for your course. Review the result before adding."
              onClose={() => setAiOpen(false)}
              actions={
                aiResult ? (
                  <>
                    <Button variant="soft" tone="slate" onClick={() => setAiResult(null)}>Regenerate</Button>
                    <Button onClick={addGeneratedModules}>Add {aiResult.length} Modules</Button>
                  </>
                ) : (
                  <>
                    <Button variant="soft" tone="slate" onClick={() => setAiOpen(false)}>Cancel</Button>
                    <Button onClick={generateModules} disabled={aiGenerating || !aiCourseId}>
                      {aiGenerating ? 'Generating...' : 'Generate'}
                    </Button>
                  </>
                )
              }
            >
              {!aiResult ? (
                <div className="grid gap-4 md:grid-cols-2">
                  <SelectInput
                    label="Course"
                    value={aiCourseId}
                    onChange={(value) => setAiCourseId(value)}
                    options={courses.map((c) => ({ value: c.id, label: c.title }))}
                    required
                  />
                  <SelectInput
                    label="Number of Modules"
                    value={String(aiCount)}
                    onChange={(value) => setAiCount(Number(value))}
                    options={[3, 5, 7, 10].map((n) => ({ value: String(n), label: `${n} modules` }))}
                  />
                  {aiGenerating && (
                    <div className="col-span-2 rounded-2xl bg-blue-50 px-4 py-3 text-sm text-brand">
                      AI is generating your modules — this takes a few seconds...
                    </div>
                  )}
                  {aiError && <div className="col-span-2 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{aiError}</div>}
                </div>
              ) : (
                <div className="space-y-3">
                  <p className="text-sm text-slatey">Review the modules below then click <strong>Add {aiResult.length} Modules</strong> to save them, or <strong>Regenerate</strong> to try again.</p>
                  {aiResult.map((mod, i) => (
                    <div key={i} className="rounded-[20px] border border-slate-100 bg-slate-50 px-4 py-3 space-y-2">
                      <div className="text-xs font-bold text-brand">Module {mod.order}</div>
                      <div className="font-semibold text-ink">{mod.title}</div>
                      <div className="text-sm text-slatey">{mod.description}</div>
                      {mod.notes && (
                        <details className="mt-1">
                          <summary className="cursor-pointer text-xs font-semibold text-brand">View notes</summary>
                          <div className="mt-3 border-t border-slate-200 pt-3">
                            <RenderMarkdown text={mod.notes} />
                          </div>
                        </details>
                      )}
                      {mod.images?.length > 0 && (
                        <div className="mt-2 flex gap-2">
                          {mod.images.map((img) => (
                            <img key={img.id} src={img.dataUrl || img.url} alt={img.label} className="h-16 w-24 rounded-xl object-cover" />
                          ))}
                        </div>
                      )}
                    </div>
                  ))}
                  {aiError && <div className="mt-2 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{aiError}</div>}
                </div>
              )}
            </Modal>
          )}

          {editing && (
            <Modal
              title={editing.id ? 'Edit Module' : 'Create Module'}
              subtitle="Use one module for each video, document bundle, or learning unit."
              onClose={() => setEditing(null)}
              actions={
                <>
                  <Button variant="soft" tone="slate" onClick={() => setEditing(null)}>Cancel</Button>
                  <Button onClick={save}>Save Module</Button>
                </>
              }
              wide
            >
              <div className="grid gap-4 md:grid-cols-2">
                <SelectInput label="Course" value={form.courseId} onChange={(value) => update('courseId', value)} options={courses.map((course) => ({ value: course.id, label: course.title }))} required />
                <TextInput label="Module Title" value={form.title} onChange={(value) => update('title', value)} required />
                <TextInput label="Display Order" value={String(form.order)} onChange={(value) => update('order', value)} type="number" />
                <TextInput
                  label="Video URL"
                  value={isUploadedVideoUrl(form.videoUrl) ? '' : form.videoUrl}
                  onChange={(value) => { update('videoUrl', value); if (videoUploadInfo) setVideoUploadInfo(null); }}
                  placeholder="YouTube / Vimeo / hosted video link"
                  disabled={!!videoUploadInfo}
                />
              </div>
              <div className="mt-4 rounded-[24px] border border-slate-200 bg-slate-50 p-5">
                <div className="flex flex-wrap items-start justify-between gap-3">
                  <div>
                    <h3 className="display-font text-lg font-800 text-ink">Upload Video File</h3>
                    <p className="mt-2 text-sm text-slatey">Upload an MP4 (or WebM / MOV) video file directly. Use this instead of the URL above when you have a local video.</p>
                  </div>
                  {videoUploadInfo && <Tag tone="green">Video uploaded</Tag>}
                </div>
                <label className={`mt-4 flex flex-col items-center justify-center gap-1 rounded-2xl border-2 border-dashed border-slate-300 bg-white px-4 py-6 text-sm font-semibold text-slate-600 transition hover:border-blue-300 hover:bg-blue-50/40 ${videoUploading ? 'pointer-events-none opacity-70' : 'cursor-pointer'}`}>
                  <span className="text-2xl">＋</span>
                  <span>{videoUploading ? 'Uploading to secure storage…' : 'Click to choose an .mp4 video'}</span>
                  <span className="text-xs font-normal text-slate-400">Up to 500 MB. Stored on Firebase Storage. Replaces any URL above.</span>
                  <input
                    ref={videoInputRef}
                    type="file"
                    accept="video/mp4,video/webm,video/ogg,video/quicktime,video/*"
                    className="hidden"
                    disabled={videoUploading}
                    onChange={(e) => onVideoFileChange(e.target.files)}
                  />
                </label>
                {videoUploadInfo && (
                  <div className="mt-4 flex flex-wrap items-center justify-between gap-3 rounded-2xl bg-white px-4 py-3 text-sm shadow-soft">
                    <div className="min-w-0">
                      <div className="truncate font-semibold text-ink">{videoUploadInfo.name}</div>
                      {videoUploadInfo.size > 0 && (
                        <div className="text-xs text-slate-500">{(videoUploadInfo.size / (1024 * 1024)).toFixed(2)} MB</div>
                      )}
                    </div>
                    <button
                      type="button"
                      onClick={clearUploadedVideo}
                      className="rounded-xl bg-red-50 px-3 py-2 text-xs font-semibold text-red-600 hover:bg-red-100"
                    >
                      Remove
                    </button>
                  </div>
                )}
              </div>
              <div className="mt-4 grid gap-4">
                <TextArea label="Module Description" value={form.description} onChange={(value) => update('description', value)} rows={3} />
                <TextArea label="Notes / Learning Content" value={form.notes} onChange={(value) => update('notes', value)} rows={6} placeholder="The notes are shown to learners on the module page in a horizontal card." />
              </div>

              <Divider />

              <div className="grid gap-6 lg:grid-cols-2">
                <div className="rounded-[24px] border border-slate-200 bg-slate-50 p-5">
                  <h3 className="display-font text-lg font-800 text-ink">Profile-Based Visibility</h3>
                  <p className="mt-2 text-sm text-slatey">Use these rules when modules should only appear for specific employee profiles.</p>
                  <div className="mt-4 space-y-4">
                    <TextInput label="Designation Contains" value={form.applicability.designationKeyword} onChange={(value) => updateApplicability('designationKeyword', value)} placeholder="e.g. technician" />
                    <TextInput label="Department Contains" value={form.applicability.departmentKeyword} onChange={(value) => updateApplicability('departmentKeyword', value)} placeholder="e.g. operations" />
                    <div>
                      <div className="mb-2 text-sm font-semibold text-slate-700">Business Lines</div>
                      <div className="flex flex-wrap gap-2">
                        {BUSINESS_LINES.filter((line) => line !== 'Other').map((line) => (
                          <CheckboxPill key={line} checked={(form.applicability.businessLines || []).includes(line)} onChange={() => toggleArrayValue('businessLines', line)} label={line} />
                        ))}
                      </div>
                    </div>
                  </div>
                </div>

                <div className="space-y-4">
                  <div className="rounded-[24px] border border-slate-200 bg-slate-50 p-5">
                    <div className="flex items-start justify-between gap-3">
                      <div>
                        <h3 className="display-font text-lg font-800 text-ink">Documents</h3>
                        <p className="mt-2 text-sm text-slatey">Add PDF, Word, PowerPoint, or other training documents — up to {MAX_MODULE_DOCS} per module. Learners can view and download all of them.</p>
                      </div>
                      <Tag tone="blue">{(form.documents || []).length + pendingDocs.length} of {MAX_MODULE_DOCS}</Tag>
                    </div>
                    {(() => {
                      const atMax = (form.documents || []).length + pendingDocs.length >= MAX_MODULE_DOCS;
                      return (
                        <label className={`mt-4 flex ${atMax ? 'cursor-not-allowed opacity-50' : 'cursor-pointer'} flex-col items-center justify-center gap-1 rounded-2xl border-2 border-dashed border-slate-300 bg-white px-4 py-6 text-sm font-semibold text-slate-600 transition hover:border-blue-300 hover:bg-blue-50/40`}>
                          <span className="text-2xl">＋</span>
                          <span>{atMax ? `Maximum ${MAX_MODULE_DOCS} documents reached` : 'Click to add document(s)'}</span>
                          <span className="text-xs font-normal text-slate-400">Click again to keep adding more — or select several at once</span>
                          <input
                            ref={docInputRef}
                            type="file"
                            multiple
                            disabled={atMax}
                            className="hidden"
                            onChange={(e) => onDocFileChange(e.target.files)}
                          />
                        </label>
                      );
                    })()}
                    {pendingDocs.length > 0 && (
                      <div className="mt-4 space-y-2 rounded-[20px] bg-white p-4 shadow-soft">
                        <div className="flex items-center justify-between">
                          <div className="text-sm font-semibold text-slate-700">New Documents ({pendingDocs.length})</div>
                          <Tag tone="amber">Pending Save</Tag>
                        </div>
                        {pendingDocs.map((entry) => (
                          <div key={entry.id} className="flex items-center justify-between gap-3 rounded-xl bg-slate-50 px-3 py-2">
                            <div className="min-w-0">
                              <div className="truncate text-xs font-semibold text-slate-700">{entry.file.name}</div>
                              <div className="text-[11px] text-slate-400">{formatFileSize(entry.file.size)}</div>
                            </div>
                            <button type="button" onClick={() => removePendingDoc(entry.id)} className="rounded-lg bg-red-50 px-3 py-1.5 text-xs font-semibold text-red-600 hover:bg-red-100">Remove</button>
                          </div>
                        ))}
                      </div>
                    )}
                    {(form.documents || []).length > 0 && (
                      <div className="mt-4">
                        <div className="mb-2 text-xs font-bold uppercase tracking-[0.22em] text-slate-400">Saved Documents</div>
                        <div className="flex flex-wrap gap-2">
                          {(form.documents || []).map((file) => (
                            <span key={file.id} className="inline-flex items-center gap-2 rounded-full bg-white px-3 py-2 text-xs font-semibold text-slate-700 shadow-soft">
                              {file.name}
                              <button type="button" onClick={() => removeAsset('documents', file.id)} className="text-red-600">×</button>
                            </span>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                  <div className="rounded-[24px] border border-slate-200 bg-slate-50 p-5">
                    <div className="flex items-start justify-between gap-3">
                      <div>
                        <h3 className="display-font text-lg font-800 text-ink">Pictures / Images</h3>
                        <p className="mt-2 text-sm text-slatey">Add multiple diagrams, posters, or reference visuals — they appear in a learner-facing carousel.</p>
                      </div>
                      <Tag tone="blue">{(form.images || []).length + pendingImages.length} total</Tag>
                    </div>
                    <label className="mt-4 flex cursor-pointer flex-col items-center justify-center gap-1 rounded-2xl border-2 border-dashed border-slate-300 bg-white px-4 py-6 text-sm font-semibold text-slate-600 transition hover:border-blue-300 hover:bg-blue-50/40">
                      <span className="text-2xl">＋</span>
                      <span>Click to add image(s)</span>
                      <span className="text-xs font-normal text-slate-400">You can add as many as you want — repeat to keep adding more</span>
                      <input
                        ref={imageInputRef}
                        type="file"
                        accept="image/*"
                        multiple
                        className="hidden"
                        onChange={(e) => onImageFileChange(e.target.files)}
                      />
                    </label>
                    <div className="mt-3 rounded-[20px] border border-slate-200 bg-white p-4">
                      <div className="mb-3 text-xs font-bold uppercase tracking-[0.22em] text-brand">✦ Generate Image from Keyword</div>
                      <div className="grid gap-2 md:grid-cols-2">
                        <input
                          value={imgGenKeyword}
                          onChange={(e) => setImgGenKeyword(e.target.value)}
                          className="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-blue-400"
                          placeholder="Search keyword (e.g. workplace safety)"
                        />
                        <input
                          value={imgGenLabel}
                          onChange={(e) => setImgGenLabel(e.target.value)}
                          className="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-blue-400"
                          placeholder="Image title / label (optional)"
                        />
                      </div>
                      <button
                        type="button"
                        onClick={generateImage}
                        disabled={imgGenLoading || !imgGenKeyword.trim()}
                        className="mt-2 rounded-xl bg-brand px-4 py-2 text-sm font-semibold text-white disabled:opacity-40 hover:opacity-90"
                      >
                        {imgGenLoading ? 'Searching...' : '✦ Generate Image'}
                      </button>
                      {imgGenError && <div className="mt-2 text-xs text-red-600">{imgGenError}</div>}
                    </div>
                    {pendingImages.length > 0 && (
                      <div className="mt-4 space-y-3 rounded-[20px] bg-white p-4 shadow-soft">
                        <div className="flex items-center justify-between">
                          <div className="text-sm font-semibold text-slate-700">Label New Pictures ({pendingImages.length})</div>
                          <Tag tone="amber">Pending Save</Tag>
                        </div>
                        {pendingImages.map((entry) => (
                          <div key={entry.id} className="grid gap-3 md:grid-cols-[160px_1fr_auto] md:items-center">
                            <div className="truncate rounded-xl bg-slate-50 px-3 py-2 text-xs font-semibold text-slate-600">{entry.file.name}</div>
                            <input
                              value={entry.label}
                              onChange={(e) => updatePendingImageLabel(entry.id, e.target.value)}
                              className="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-blue-400"
                              placeholder="Picture label"
                            />
                            <button
                              type="button"
                              onClick={() => removePendingImage(entry.id)}
                              className="rounded-xl bg-red-50 px-3 py-2 text-xs font-semibold text-red-600 hover:bg-red-100"
                            >
                              Remove
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                    {(form.images || []).length > 0 && (
                      <div className="mt-4">
                        <div className="mb-2 text-xs font-bold uppercase tracking-[0.22em] text-slate-400">Saved Images</div>
                        <div className="overflow-x-auto">
                          <div className="flex gap-3 pb-2">
                            {(form.images || []).map((file) => (
                              <div key={file.id} className="min-w-[220px] overflow-hidden rounded-[20px] border border-white bg-white shadow-soft">
                                <img src={file.dataUrl || file.url} alt={file.label || file.name} className="h-28 w-full object-cover" />
                                <div className="flex items-center justify-between gap-2 px-3 py-2 text-xs font-semibold text-slate-600">
                                  <div className="min-w-0">
                                    <div className="truncate">{file.label || file.name}</div>
                                    <div className="truncate text-[11px] text-slate-400">{file.name}</div>
                                  </div>
                                  <button type="button" onClick={() => removeAsset('images', file.id)} className="text-red-600">Remove</button>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
              {error && <div className="mt-4 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{error}</div>}
            </Modal>
          )}
        </div>
      );
    };

    const AssignmentManagement = ({ users, courses, assignments, setAssignments, assignmentRules, setAssignmentRules }) => {
      const learners = users.filter((user) => user.role === 'learner');
      const [manual, setManual] = useState({ email: learners[0]?.email || '', courseId: courses[0]?.id || '', dueDate: '', assignmentType: 'Essential' });
      const [rule, setRule] = useState({
        name: '',
        courseId: courses[0]?.id || '',
        dueDate: '',
        designationKeyword: '',
        departmentKeyword: '',
        businessLines: [],
      });
      const [message, setMessage] = useState('');

      useEffect(() => {
        setManual((prev) => ({ ...prev, email: learners[0]?.email || prev.email || '', courseId: courses[0]?.id || prev.courseId || '' }));
        setRule((prev) => ({ ...prev, courseId: courses[0]?.id || prev.courseId || '' }));
      }, [learners.length, courses.length]);

      const addManual = () => {
        if (!manual.email || !manual.courseId) {
          setMessage('Select a learner and a course first.');
          return;
        }
        const exists = assignments.some((item) => item.email === manual.email && item.courseId === manual.courseId);
        if (exists) {
          setMessage('That learner already has this course assigned.');
          return;
        }
        setAssignments([
          ...assignments,
          {
            id: uid(),
            email: manual.email,
            courseId: manual.courseId,
            dueDate: manual.dueDate,
            assignedAt: Date.now(),
            source: 'Manual assignment',
            assignmentType: manual.assignmentType || 'Essential',
          },
        ]);
        setMessage('Manual course assignment created.');
      };

      const toggleRuleValue = (field, value) => {
        const current = rule[field] || [];
        setRule((prev) => ({ ...prev, [field]: current.includes(value) ? current.filter((item) => item !== value) : [...current, value] }));
      };

      const applyRuleToLearners = (nextRule, currentAssignments) => {
        const additions = [];
        learners.forEach((learner) => {
          if (!ruleMatchesUser(nextRule, learner)) return;
          const exists = currentAssignments.some((item) => item.email === learner.email && item.courseId === nextRule.courseId);
          if (!exists) {
            additions.push({
              id: uid(),
              email: learner.email,
              courseId: nextRule.courseId,
              dueDate: nextRule.dueDate,
              assignedAt: Date.now(),
              source: `Rule: ${nextRule.name}`,
            });
          }
        });
        if (additions.length) {
          setAssignments([...currentAssignments, ...additions]);
        }
      };

      const saveRule = () => {
        if (!clean(rule.name, 120) || !rule.courseId) {
          setMessage('Enter a rule name and choose a target course.');
          return;
        }
        const nextRule = {
          id: uid(),
          name: clean(rule.name, 120),
          courseId: rule.courseId,
          dueDate: rule.dueDate,
          designationKeyword: clean(rule.designationKeyword, 80),
          departmentKeyword: clean(rule.departmentKeyword, 80),
          businessLines: rule.businessLines,
          createdAt: Date.now(),
        };
        setAssignmentRules([...assignmentRules, nextRule]);
        applyRuleToLearners(nextRule, assignments);
        setRule({
          name: '',
          courseId: courses[0]?.id || '',
          dueDate: '',
          designationKeyword: '',
          departmentKeyword: '',
          businessLines: [],
        });
        setMessage('Assignment rule saved and applied to matching employees.');
      };

      const removeAssignment = (id) => setAssignments(assignments.filter((item) => item.id !== id));
      const removeRule = (id) => setAssignmentRules(assignmentRules.filter((item) => item.id !== id));
      const userOf = (email) => users.find((user) => user.email === email);
      const courseOf = (courseId) => courses.find((course) => course.id === courseId);

      return (
        <div className="space-y-6">
          <SectionTitle
            title="Assignment Management"
            subtitle="Assign full courses manually or build reusable assignment logic based on employee type, designation, department, and business line."
          />
          {message && <div className="rounded-2xl border border-blue-200 bg-blue-50 px-4 py-3 text-sm text-brand">{message}</div>}
          <div className="grid gap-6 xl:grid-cols-2">
            <Panel className="p-6 md:p-8">
              <h2 className="display-font text-2xl font-800 text-ink">Manual Course Assignment</h2>
              <p className="mt-2 text-sm text-slatey">Use this for one-to-one assignment after reviewing a participant profile.</p>
              <div className="mt-6 grid gap-4">
                <SelectInput label="Learner" value={manual.email} onChange={(value) => setManual((prev) => ({ ...prev, email: value }))} options={[{ value: '', label: 'Select learner' }, ...learners.map((learner) => ({ value: learner.email, label: `${learner.name} (${learner.employeeId})` }))]} />
                <SelectInput label="Course" value={manual.courseId} onChange={(value) => setManual((prev) => ({ ...prev, courseId: value }))} options={[{ value: '', label: 'Select course' }, ...courses.map((course) => ({ value: course.id, label: course.title }))]} />
                <div>
                  <div className="mb-2 text-sm font-semibold text-slate-700">Assign as</div>
                  <div className="flex gap-2">
                    {['Essential', 'Desirable'].map((type) => (
                      <button key={type} onClick={() => setManual((prev) => ({ ...prev, assignmentType: type }))}
                        className={`px-4 py-1.5 rounded-full text-sm font-semibold border transition-colors ${manual.assignmentType === type ? (type === 'Essential' ? 'bg-amber-500 text-white border-amber-500' : 'bg-teal-500 text-white border-teal-500') : 'bg-white text-slate-600 border-slate-200 hover:border-slate-400'}`}>
                        {type}
                      </button>
                    ))}
                  </div>
                </div>
                <TextInput label="Due Date" value={manual.dueDate} onChange={(value) => setManual((prev) => ({ ...prev, dueDate: value }))} type="date" />
              </div>
              <div className="mt-6">
                <Button onClick={addManual}>Assign Course</Button>
              </div>
            </Panel>

            <Panel className="p-6 md:p-8">
              <h2 className="display-font text-2xl font-800 text-ink">Profile-Based Assignment Rule</h2>
              <p className="mt-2 text-sm text-slatey">Rules automatically assign matching learners and also apply to future HR-created employees.</p>
              <div className="mt-6 grid gap-4">
                <TextInput label="Rule Name" value={rule.name} onChange={(value) => setRule((prev) => ({ ...prev, name: value }))} placeholder="e.g. Operations induction" />
                <SelectInput label="Target Course" value={rule.courseId} onChange={(value) => setRule((prev) => ({ ...prev, courseId: value }))} options={[{ value: '', label: 'Select course' }, ...courses.map((course) => ({ value: course.id, label: course.title }))]} />
                <TextInput label="Default Due Date" value={rule.dueDate} onChange={(value) => setRule((prev) => ({ ...prev, dueDate: value }))} type="date" />
                <TextInput label="Designation Contains" value={rule.designationKeyword} onChange={(value) => setRule((prev) => ({ ...prev, designationKeyword: value }))} placeholder="e.g. engineer" />
                <TextInput label="Department Contains" value={rule.departmentKeyword} onChange={(value) => setRule((prev) => ({ ...prev, departmentKeyword: value }))} placeholder="e.g. operations" />
                <div>
                  <div className="mb-2 text-sm font-semibold text-slate-700">Business Lines</div>
                  <div className="flex flex-wrap gap-2">
                    {BUSINESS_LINES.filter((line) => line !== 'Other').map((line) => (
                      <CheckboxPill key={line} checked={rule.businessLines.includes(line)} onChange={() => toggleRuleValue('businessLines', line)} label={line} />
                    ))}
                  </div>
                </div>
              </div>
              <div className="mt-6">
                <Button tone="secondary" onClick={saveRule}>Save Rule</Button>
              </div>
            </Panel>
          </div>

          <div className="grid gap-6 xl:grid-cols-2">
            <Panel className="overflow-hidden">
              <div className="border-b border-slate-100 px-6 py-5">
                <h2 className="display-font text-2xl font-800 text-ink">Active Assignments</h2>
              </div>
              {assignments.length === 0 ? (
                <div className="p-6"><EmptyState title="No assignments yet" text="Create manual or rule-based assignments to start the learning flow." /></div>
              ) : (
                <div className="table-wrap overflow-x-auto">
                  <table>
                    <thead>
                      <tr className="text-left text-xs font-bold uppercase tracking-[0.18em] text-slate-500">
                        <th className="px-5 py-4">Learner</th>
                        <th className="px-5 py-4">Course</th>
                        <th className="px-5 py-4">Source</th>
                        <th className="px-5 py-4">Due</th>
                        <th className="px-5 py-4">Action</th>
                      </tr>
                    </thead>
                    <tbody>
                      {assignments.map((assignment) => (
                        <tr key={assignment.id} className="border-t border-slate-100 hover:bg-slate-50">
                          <td className="px-5 py-4 text-sm">
                            <div className="font-semibold text-ink">{userOf(assignment.email)?.name || assignment.email}</div>
                            <div className="mt-1 text-xs text-slate-500">{assignment.email}</div>
                          </td>
                          <td className="px-5 py-4 text-sm text-slate-700">{courseOf(assignment.courseId)?.title || 'Deleted course'}</td>
                          <td className="px-5 py-4 text-sm text-slate-500">{assignment.source || 'Manual assignment'}</td>
                          <td className="px-5 py-4 text-sm text-slate-500">{fmtDate(assignment.dueDate)}</td>
                          <td className="px-5 py-4"><Button variant="soft" tone="danger" onClick={() => removeAssignment(assignment.id)}>Remove</Button></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </Panel>

            <Panel className="overflow-hidden">
              <div className="border-b border-slate-100 px-6 py-5">
                <h2 className="display-font text-2xl font-800 text-ink">Assignment Rules</h2>
              </div>
              {assignmentRules.length === 0 ? (
                <div className="p-6"><EmptyState title="No rules yet" text="Save at least one employee-profile rule to automate assignment." /></div>
              ) : (
                <div className="space-y-4 p-6">
                  {assignmentRules.map((item) => (
                    <div key={item.id} className="rounded-[22px] border border-slate-100 bg-slate-50 p-4">
                      <div className="flex flex-wrap items-start justify-between gap-3">
                        <div>
                          <div className="display-font text-lg font-800 text-ink">{item.name}</div>
                          <div className="mt-1 text-sm text-slatey">Course: {courseOf(item.courseId)?.title || 'Deleted course'}</div>
                        </div>
                        <Button variant="soft" tone="danger" onClick={() => removeRule(item.id)}>Delete</Button>
                      </div>
                      <div className="mt-3 flex flex-wrap gap-2">
                        {(item.businessLines || []).map((line) => <Tag key={line} tone="teal">{line}</Tag>)}
                        {item.designationKeyword && <Tag tone="slate">Designation: {item.designationKeyword}</Tag>}
                        {item.departmentKeyword && <Tag tone="slate">Department: {item.departmentKeyword}</Tag>}
                        {item.dueDate && <Tag tone="amber">Due {fmtDate(item.dueDate)}</Tag>}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </Panel>
          </div>
        </div>
      );
    };

    const QuizManagement = ({ courses, modules, quizzes, setQuizzes }) => {
      const blankQuestion = () => ({ id: uid(), text: '', options: ['', '', '', ''], answer: 0 });
      const blankQuiz = {
        title: '',
        scopeType: 'course',
        scopeId: courses[0]?.id || '',
        passMark: 80,
        maxAttempts: 3,
        questions: [blankQuestion()],
      };
      const [editing, setEditing] = useState(null);
      const [form, setForm] = useState(blankQuiz);
      const [error, setError] = useState('');
      const [quizGenLoading, setQuizGenLoading] = useState(false);
      const [quizGenError, setQuizGenError] = useState('');
      const [quizGenCount, setQuizGenCount] = useState(5);

      useEffect(() => {
        if (!editing) {
          setForm((prev) => ({ ...prev, scopeId: prev.scopeType === 'course' ? (courses[0]?.id || '') : (modules[0]?.id || '') }));
        }
      }, [courses.length, modules.length]);

      const openNew = () => {
        setEditing({});
        setForm({
          title: '',
          scopeType: 'course',
          scopeId: courses[0]?.id || '',
          passMark: 80,
          maxAttempts: 3,
          questions: [blankQuestion()],
        });
        setError('');
      };

      const openEdit = (quiz) => {
        setEditing(quiz);
        setForm({ ...quiz, questions: quiz.questions && quiz.questions.length ? quiz.questions : [blankQuestion()] });
        setError('');
      };

      const updateQuestion = (index, field, value) => {
        setForm((prev) => ({
          ...prev,
          questions: prev.questions.map((question, idx) => idx === index ? { ...question, [field]: value } : question),
        }));
      };

      const updateOption = (questionIndex, optionIndex, value) => {
        setForm((prev) => ({
          ...prev,
          questions: prev.questions.map((question, idx) => idx === questionIndex ? {
            ...question,
            options: question.options.map((option, optIdx) => optIdx === optionIndex ? value : option),
          } : question),
        }));
      };

      const save = () => {
        if (!clean(form.title, 140) || !form.scopeId) {
          setError('Enter a quiz title and choose the related course or module.');
          return;
        }
        if (form.questions.some((question) => !clean(question.text, 300) || question.options.some((option) => !clean(option, 180)))) {
          setError('Complete every question and every option.');
          return;
        }
        const payload = {
          id: editing.id || uid(),
          title: clean(form.title, 140),
          scopeType: form.scopeType,
          scopeId: form.scopeId,
          passMark: Number(form.passMark) || 80,
          maxAttempts: Number(form.maxAttempts) || 3,
          questions: form.questions.map((question) => ({
            ...question,
            text: clean(question.text, 300),
            options: question.options.map((option) => clean(option, 180)),
          })),
          createdAt: editing.createdAt || Date.now(),
        };
        const next = editing.id ? quizzes.map((quiz) => quiz.id === editing.id ? payload : quiz) : [...quizzes, payload];
        setQuizzes(next);
        setEditing(null);
      };

      const remove = (id) => {
        if (!window.confirm('Delete this quiz?')) return;
        setQuizzes(quizzes.filter((quiz) => quiz.id !== id));
      };

      const scopeLabel = (quiz) => {
        if (quiz.scopeType === 'course') return courses.find((course) => course.id === quiz.scopeId)?.title || 'Deleted course';
        return modules.find((module) => module.id === quiz.scopeId)?.title || 'Deleted module';
      };

      const generateQuestions = async () => {
        if (!clean(form.title, 140)) { setQuizGenError('Enter a quiz title first.'); return; }
        setQuizGenLoading(true);
        setQuizGenError('');
        const scopeTitle = form.scopeType === 'course'
          ? courses.find((c) => c.id === form.scopeId)?.title
          : modules.find((m) => m.id === form.scopeId)?.title;
        try {
          const res = await fetch('/api/generate-quiz', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${await getToken() || ''}` },
            body: JSON.stringify({ quizTitle: form.title, scopeTitle, scopeType: form.scopeType, numQuestions: quizGenCount }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Generation failed.');
          setForm((prev) => ({
            ...prev,
            questions: data.questions.map((q) => ({ ...q, id: uid() })),
          }));
        } catch (err) {
          setQuizGenError(err.message || 'Something went wrong. Try again.');
        } finally {
          setQuizGenLoading(false);
        }
      };

      return (
        <div className="space-y-6">
          <SectionTitle
            title="Quiz Management"
            subtitle="Create quizzes after either a full course or an individual module, with pass marks and limited attempts."
            action={<Button onClick={openNew}>Create Quiz</Button>}
          />
          <Panel className="overflow-hidden">
            {quizzes.length === 0 ? (
              <div className="p-6"><EmptyState title="No quizzes created" text="Add a course quiz or module quiz." /></div>
            ) : (
              <div className="table-wrap overflow-x-auto">
                <table>
                  <thead>
                    <tr className="text-left text-xs font-bold uppercase tracking-[0.18em] text-slate-500">
                      <th className="px-5 py-4">Quiz</th>
                      <th className="px-5 py-4">Scope</th>
                      <th className="px-5 py-4">Questions</th>
                      <th className="px-5 py-4">Pass Mark</th>
                      <th className="px-5 py-4">Attempts</th>
                      <th className="px-5 py-4">Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    {quizzes.map((quiz) => (
                      <tr key={quiz.id} className="border-t border-slate-100 hover:bg-slate-50">
                        <td className="px-5 py-4 text-sm font-semibold text-ink">{quiz.title}</td>
                        <td className="px-5 py-4 text-sm text-slate-600">
                          <Tag tone={quiz.scopeType === 'course' ? 'blue' : 'teal'}>{quiz.scopeType === 'course' ? 'Course Quiz' : 'Module Quiz'}</Tag>
                          <div className="mt-2 text-xs text-slate-500">{scopeLabel(quiz)}</div>
                        </td>
                        <td className="px-5 py-4 text-sm text-slate-600">{quiz.questions.length}</td>
                        <td className="px-5 py-4"><Tag tone="amber">{quiz.passMark}%</Tag></td>
                        <td className="px-5 py-4 text-sm text-slate-600">{quiz.maxAttempts}</td>
                        <td className="px-5 py-4">
                          <div className="flex gap-2">
                            <Button variant="soft" onClick={() => openEdit(quiz)}>Edit</Button>
                            <Button variant="soft" tone="danger" onClick={() => remove(quiz.id)}>Delete</Button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </Panel>

          {editing && (
            <Modal
              title={editing.id ? 'Edit Quiz' : 'Create Quiz'}
              subtitle="Design the assessment that appears after a course or module."
              onClose={() => setEditing(null)}
              actions={
                <>
                  <Button variant="soft" tone="slate" onClick={() => setEditing(null)}>Cancel</Button>
                  <Button onClick={save}>Save Quiz</Button>
                </>
              }
              wide
            >
              <div className="grid gap-4 md:grid-cols-2">
                <TextInput label="Quiz Title" value={form.title} onChange={(value) => setForm((prev) => ({ ...prev, title: value }))} />
                <SelectInput
                  label="Quiz Scope"
                  value={form.scopeType}
                  onChange={(value) => setForm((prev) => ({
                    ...prev,
                    scopeType: value,
                    scopeId: value === 'course' ? (courses[0]?.id || '') : (modules[0]?.id || ''),
                  }))}
                  options={[
                    { value: 'course', label: 'After a Course' },
                    { value: 'module', label: 'After a Module' },
                  ]}
                />
                <SelectInput
                  label={form.scopeType === 'course' ? 'Course' : 'Module'}
                  value={form.scopeId}
                  onChange={(value) => setForm((prev) => ({ ...prev, scopeId: value }))}
                  options={(form.scopeType === 'course' ? courses : modules).map((item) => ({ value: item.id, label: item.title }))}
                />
                <TextInput label="Pass Mark (%)" value={String(form.passMark)} onChange={(value) => setForm((prev) => ({ ...prev, passMark: value }))} type="number" />
                <TextInput label="Max Attempts" value={String(form.maxAttempts)} onChange={(value) => setForm((prev) => ({ ...prev, maxAttempts: value }))} type="number" />
              </div>

              <Divider />

              <div className="space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-3">
                  <h3 className="display-font text-xl font-800 text-ink">Questions</h3>
                  <div className="flex flex-wrap items-center gap-2">
                    <select
                      value={quizGenCount}
                      onChange={(e) => setQuizGenCount(Number(e.target.value))}
                      className="rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-blue-400"
                    >
                      {[3, 5, 7, 10, 15].map((n) => <option key={n} value={n}>{n} questions</option>)}
                    </select>
                    <button
                      type="button"
                      onClick={generateQuestions}
                      disabled={quizGenLoading}
                      className="rounded-xl bg-brand px-4 py-2 text-sm font-semibold text-white disabled:opacity-40 hover:opacity-90"
                    >
                      {quizGenLoading ? 'Generating...' : '✦ Generate with AI'}
                    </button>
                    <Button variant="soft" tone="secondary" onClick={() => setForm((prev) => ({ ...prev, questions: [...prev.questions, blankQuestion()] }))}>Add Question</Button>
                  </div>
                </div>
                {quizGenError && <div className="rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{quizGenError}</div>}
                {quizGenLoading && <div className="rounded-2xl bg-blue-50 px-4 py-3 text-sm text-brand">AI is writing your quiz questions — this takes a few seconds...</div>}
                {form.questions.map((question, index) => (
                  <div key={question.id} className="rounded-[24px] border border-slate-200 bg-slate-50 p-5">
                    <div className="mb-4 flex items-center justify-between gap-3">
                      <Tag tone="blue">Question {index + 1}</Tag>
                      {form.questions.length > 1 && <Button variant="soft" tone="danger" onClick={() => setForm((prev) => ({ ...prev, questions: prev.questions.filter((_, idx) => idx !== index) }))}>Remove</Button>}
                    </div>
                    <TextInput label="Question Text" value={question.text} onChange={(value) => updateQuestion(index, 'text', value)} />
                    <div className="mt-4 grid gap-3 md:grid-cols-2">
                      {question.options.map((option, optionIndex) => (
                        <label key={optionIndex} className={`rounded-2xl border px-4 py-3 text-sm ${question.answer === optionIndex ? 'border-blue-400 bg-blue-50' : 'border-slate-200 bg-white'}`}>

                <div className="mt-6 grid gap-4 sm:grid-cols-2">
                  <div className="rounded-[24px] bg-blue-50 p-5">
                    <div className="text-sm font-semibold text-brand">Certificates Issued</div>
                    <div className="display-font mt-2 text-4xl font-800 text-brand">{completionCount}</div>

                <div className="px-6 py-5">

    const Reports = ({ users, courses, assignments, modules, quizzes, quizAttempts, progress, certificates }) => {

                return (

                      <div>
                        <h2 className="display-font text-2xl font-800 text-ink">{learner.name}</h2>

                        <Tag tone="blue">{learnerAssignments.length} Assigned</Tag>

                    <div className="mt-6 grid gap-4 xl:grid-cols-2">
                      {learnerAssignments.length === 0 ? (

                        const bestScore = relatedAttempts.length ? Math.max(...relatedAttempts.map((item) => item.score)) : null;
                        return (

                            <div className="flex flex-wrap items-start justify-between gap-3">
                              <div>
                                <div className="display-font text-lg font-800 text-ink">{course.title}</div>
                                <div className="mt-1 flex flex-wrap gap-2">
                                  <Tag tone={course.type === 'Essential' ? 'amber' : 'teal'}>{course.type}</Tag>
                                  <Tag tone="blue">{course.trainingType}</Tag>

                  </Panel>

    const CelebrationBurst = ({ score, passMark }) => {
      const pieces = useMemo(() => {
        const palette = ['#f43f5e', '#f59e0b', '#10b981', '#2563eb', '#a855f7', '#ec4899', '#facc15'];
        return Array.from({ length: 36 }).map((_, index) => ({
          id: index,
          left: Math.random() * 100,
          drift: (Math.random() * 160 - 80).toFixed(0) + 'px',
          delay: (Math.random() * 1.5).toFixed(2),
          duration: (1.8 + Math.random() * 1.6).toFixed(2),
          color: palette[index % palette.length],
          rotate: Math.floor(Math.random() * 360),
        }));
      }, []);
      return (
        <div className="celebrate-card rounded-[24px] border border-emerald-200 p-8 text-center shadow-float">
          <div className="confetti-layer" aria-hidden="true">
            {pieces.map((piece) => (
              <span
                key={piece.id}
                className="confetti-piece"
                style={{
                  left: piece.left + '%',
                  background: piece.color,
                  '--drift': piece.drift,
                  animationDelay: piece.delay + 's',
                  animationDuration: piece.duration + 's',
                  transform: `rotate(${piece.rotate}deg)`,
                }}
              />
            ))}
          </div>
          <div className="relative">
            <div className="text-5xl md:text-6xl">
              <span className="celebrate-emoji">🎉</span>
              <span className="celebrate-emoji delay-1 mx-2">🥳</span>
              <span className="celebrate-emoji delay-2">🎊</span>
            </div>
            <div className="display-font celebrate-title mt-5 text-3xl font-800 md:text-4xl">
              GOOD JOB, KEEP ROCKING!
            </div>
            <p className="mt-3 text-sm font-semibold text-emerald-800">
              You scored <span className="text-lg">{score}%</span> — well above the {passMark}% pass mark.
            </p>
            <p className="mt-1 text-xs uppercase tracking-[0.32em] text-emerald-700/80">
              Quiz Passed
            </p>
          </div>
        </div>
      );
    };

    const QuizPlayer = ({ user, quiz, quizAttempts, setQuizAttempts, onClose, course, modules, assignments, progress, quizzes }) => {
      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);
      const [score, setScore] = useState(0);
      const [completionMessage, setCompletionMessage] = useState(null);
      const attempts = quizAttempts.filter((item) => item.email === user.email && item.quizId === quiz.id);
      const priorPass = attempts.some((item) => item.passed);
      const alreadyPassed = priorPass && !submitted;
      const attemptsLeft = quiz.maxAttempts - attempts.length;

      const submit = () => {
        if (Object.keys(answers).length !== quiz.questions.length) return;
        let correct = 0;
        quiz.questions.forEach((question, index) => {
          if (answers[index] === question.answer) correct += 1;
        });
        const result = Math.round((correct / quiz.questions.length) * 100);
        const passed = result >= quiz.passMark;
        const newAttempt = {
          id: uid(),
          email: user.email,
          quizId: quiz.id,
          scopeType: quiz.scopeType,
          scopeId: quiz.scopeId,
          score: result,
          passed,
          takenAt: Date.now(),
        };

        if (passed && course && Array.isArray(modules) && Array.isArray(assignments) && Array.isArray(progress) && Array.isArray(quizzes)) {
          const nextAttempts = [...quizAttempts, newAttempt];
          const nextProgress = [...progress];
          const visibleModules = getVisibleModulesForUser(modules, course.id, user);
          visibleModules.forEach((module) => {
            const done = nextProgress.some((entry) => entry.email === user.email && entry.moduleId === module.id);
            if (done) return;
            const moduleQuiz = quizzes.find((quizItem) => quizItem.scopeType === 'module' && quizItem.scopeId === module.id);
            const shouldComplete = moduleQuiz
              ? hasPassedQuiz(nextAttempts, user.email, moduleQuiz.id)
              : true;
            if (shouldComplete) {
              nextProgress.push({
                id: uid(),
                email: user.email,
                courseId: course.id,
                moduleId: module.id,
                completedAt: Date.now(),
              });
            }
          });
          const projected = courseStatusForUser({ user, course, modules, assignments, progress: nextProgress, quizzes, quizAttempts: nextAttempts });
          if (projected.completed) {
            setCompletionMessage({ kind: 'course', courseTitle: course.title });
          } else if (quiz.scopeType === 'module') {
            const passedModule = visibleModules.find((module) => {
              const moduleQuiz = quizzes.find((quizItem) => quizItem.scopeType === 'module' && quizItem.scopeId === module.id);
              return moduleQuiz && moduleQuiz.id === quiz.id;
            });
            if (passedModule) setCompletionMessage({ kind: 'module', moduleTitle: passedModule.title });
          }
        }

        setScore(result);
        setSubmitted(true);
        setQuizAttempts([...quizAttempts, newAttempt]);
      };

      return (
        <Modal
          title={quiz.title}
          subtitle={`${quiz.questions.length} questions • Pass mark ${quiz.passMark}% • Attempts left ${Math.max(attemptsLeft, 0)}`}
          onClose={onClose}
          actions={
            submitted
              ? <Button onClick={onClose}>{score >= quiz.passMark ? 'Return to Course' : 'Close'}</Button>
              : <Button onClick={submit} disabled={alreadyPassed || attemptsLeft <= 0}>Submit Quiz</Button>
          }
          wide
        >
          {submitted ? (
            <div className="space-y-4">
              {score >= quiz.passMark ? (
                <>
                  <CelebrationBurst score={score} passMark={quiz.passMark} />
                  {completionMessage && (
                    <div className="rounded-[24px] border border-emerald-200 bg-emerald-50 p-6 text-center shadow-soft">
                      <div className="text-[11px] font-bold uppercase tracking-[0.32em] text-emerald-700">
                        {completionMessage.kind === 'course' ? 'Course Completed' : 'Module Completed'}
                      </div>
                      <h4 className="display-font mt-2 text-2xl font-800 text-emerald-900">
                        {completionMessage.kind === 'course'
                          ? `You finished “${completionMessage.courseTitle}”`
                          : `You finished “${completionMessage.moduleTitle}”`}
                      </h4>
                      {completionMessage.kind === 'course' ? (
                        <p className="mt-3 text-sm leading-6 text-emerald-800">
                          🎓 Your certificate has been generated and sent to <span className="font-semibold">{user.email}</span>. You can also download it from the Certificates &amp; Badges page.
                        </p>
                      ) : (
                        <p className="mt-3 text-sm leading-6 text-emerald-800">
                          This module is now marked complete. Move on to the next module to keep going.
                        </p>
                      )}
                    </div>
                  )}
                </>
              ) : (
                <div className="rounded-[24px] bg-red-50 p-6 text-center text-red-700">
                  <div className="display-font text-5xl font-800">{score}%</div>
                  <div className="mt-2 text-base font-semibold">Not Yet Passed</div>
                  <div className="mt-1 text-xs uppercase tracking-[0.28em] text-red-600/80">Pass mark {quiz.passMark}%</div>
                </div>
              )}
              {quiz.questions.map((question, index) => (
                <div key={question.id} className={`rounded-[24px] border p-5 ${answers[index] === question.answer ? 'border-emerald-200 bg-emerald-50' : 'border-red-200 bg-red-50'}`}>
                  <div className="font-semibold text-ink">{question.text}</div>
                  <div className="mt-3 text-sm">Your answer: <span className="font-semibold">{question.options[answers[index]] || '—'}</span></div>
                  {answers[index] !== question.answer && <div className="mt-2 text-sm">Correct answer: <span className="font-semibold">{question.options[question.answer]}</span></div>}
                </div>
              ))}
            </div>
          ) : alreadyPassed ? (
            <div className="rounded-[24px] border border-emerald-200 bg-emerald-50 p-6 text-sm text-emerald-800">
              You already passed this quiz. No further attempt is required.
            </div>
          ) : attemptsLeft <= 0 ? (
            <div className="rounded-[24px] border border-red-200 bg-red-50 p-6 text-sm text-red-700">
              Maximum attempts reached. Contact admin if you need a reset.
            </div>
          ) : (
            <div className="space-y-4">
              {quiz.questions.map((question, index) => (
                <div key={question.id} className="rounded-[24px] border border-slate-200 bg-slate-50 p-5">
                  <div className="display-font text-lg font-800 text-ink">Q{index + 1}. {question.text}</div>
                  <div className="mt-4 grid gap-3">
                    {question.options.map((option, optionIndex) => (
                      <label key={optionIndex} className={`flex cursor-pointer items-center gap-3 rounded-2xl border px-4 py-3 text-sm ${answers[index] === optionIndex ? 'border-blue-400 bg-blue-50' : 'border-slate-200 bg-white hover:bg-slate-50'}`}>
                        <input type="radio" checked={answers[index] === optionIndex} onChange={() => setAnswers((prev) => ({ ...prev, [index]: optionIndex }))} />
                        <span>{option}</span>
                      </label>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          )}
        </Modal>
      );
    };

    const ModuleSummary = ({ module }) => {
      const summary = clean(module.description, 320) || (module.notes ? clean(module.notes, 320) : '');
      if (!summary) return null;
      return (
        <div className="rounded-[24px] border border-slate-100 bg-gradient-to-br from-blue-50/70 via-white to-teal-50/60 p-6 shadow-soft">
          <div className="flex items-center gap-2 text-[11px] font-bold uppercase tracking-[0.28em] text-brand">
            <span className="inline-block h-1.5 w-6 rounded-full bg-brand" />
            Quick Summary
          </div>
          <p className="mt-3 text-base leading-7 text-slate-700">{summary}</p>
        </div>
      );
    };

    const ModuleLearningCard = ({ module, course, index, total, user, progress, quizzes, quizAttempts, setOpenQuiz }) => {
      const done = progress.some((entry) => entry.email === user.email && entry.moduleId === module.id);
      const moduleQuiz = quizzes.find((quiz) => quiz.scopeType === 'module' && quiz.scopeId === module.id);
      const moduleQuizPassed = moduleQuiz ? hasPassedQuiz(quizAttempts, user.email, moduleQuiz.id) : true;
      return (
        <article className="module-card">
          <Reveal>
            <div className="flex flex-wrap items-center justify-between gap-3 text-[11px] font-bold uppercase tracking-[0.32em] text-slate-400">
              <span>Module {module.order || index + 1} of {total}</span>
              <span className="flex items-center gap-2">
                {done ? <Tag tone="green">Completed</Tag> : <Tag tone="slate">In Progress</Tag>}
                {moduleQuiz && <Tag tone={moduleQuizPassed ? 'green' : 'amber'}>{moduleQuizPassed ? 'Quiz Passed' : 'Quiz Pending'}</Tag>}
              </span>
            </div>
          </Reveal>

          {module.videoUrl ? (
            <Reveal delay={80} className="mt-4">
              <VideoFrame url={module.videoUrl} title={module.title} />
            </Reveal>
          ) : (
            <Reveal delay={80} className="mt-4">
              <div className="flex h-56 items-center justify-center rounded-[28px] border border-dashed border-slate-200 bg-slate-50 text-sm text-slate-400">
                No video added for this module
              </div>
            </Reveal>
          )}

          <Reveal delay={140} className="mt-5">
            <ModuleSummary module={module} />
          </Reveal>

          <Reveal delay={200} className="mt-8">
            <div>
              <div className="text-[11px] font-bold uppercase tracking-[0.32em] text-tealish">Module</div>
              <h3 className="display-font mt-2 text-3xl font-800 leading-tight text-ink md:text-4xl">{module.title}</h3>
              {module.description && (
                <p className="mt-3 max-w-3xl text-sm leading-7 text-slatey">{module.description}</p>
              )}
            </div>
          </Reveal>

          {module.notes && (
            <Reveal delay={260} className="mt-6">

    const CourseDetailContent = ({ user, course, modules, quizzes, assignments, progress, setProgress, quizAttempts, setQuizAttempts }) => {
      const visibleModules = getVisibleModulesForUser(modules, course.id, user);
      const [openQuiz, setOpenQuiz] = useState(null);
      const courseQuiz = quizzes.find((quiz) => quiz.scopeType === 'course' && quiz.scopeId === course.id);
      const status = courseStatusForUser({ user, course, modules, assignments, progress, quizzes, quizAttempts });

      useEffect(() => {
        if (!visibleModules.length) return;
        const additions = [];
        visibleModules.forEach((module) => {
          const alreadyDone = progress.some((entry) => entry.email === user.email && entry.moduleId === module.id);
          if (alreadyDone) return;
          const moduleQuiz = quizzes.find((quiz) => quiz.scopeType === 'module' && quiz.scopeId === module.id);
          const shouldComplete = moduleQuiz
            ? hasPassedQuiz(quizAttempts, user.email, moduleQuiz.id)
            : true;
          if (!shouldComplete) return;
          additions.push({
            id: uid(),
            email: user.email,
            courseId: course.id,
            moduleId: module.id,
            completedAt: Date.now(),
          });
        });
        if (additions.length) {
          setProgress([...progress, ...additions]);
        }
      }, [visibleModules.map((module) => module.id).join('|'), quizAttempts, progress.length]);

      return (
        <>
          <div className="space-y-8">
            <Reveal>
              <div className="relative overflow-hidden rounded-[28px] border border-slate-100 bg-gradient-to-br from-white via-slate-50 to-blue-50 p-6 shadow-soft md:p-8">
                <div className="absolute -right-16 -top-16 h-48 w-48 rounded-full bg-brand/10 blur-3xl" />
                <div className="absolute -left-12 -bottom-12 h-40 w-40 rounded-full bg-tealish/15 blur-3xl" />
                <div className="relative flex flex-wrap items-end justify-between gap-6">
                  <div className="max-w-3xl">
                    <div className="flex flex-wrap gap-2">
                      <Tag tone={course.type === 'Essential' ? 'amber' : 'teal'}>{course.type}</Tag>
                      <Tag tone="blue">{course.trainingType}</Tag>
                      <Tag tone="slate">{course.focusArea}</Tag>
                    </div>
                    <p className="mt-5 text-base leading-7 text-slate-600">{course.description || 'No course description added yet.'}</p>
                    <div className="mt-4 flex flex-wrap gap-3 text-xs font-semibold uppercase tracking-[0.22em] text-slate-400">
                      <span>{visibleModules.length} {visibleModules.length === 1 ? 'Module' : 'Modules'}</span>
                      <span>•</span>
                      <span>{status.passedQuizCount}/{status.totalQuizCount} Quizzes Passed</span>

                    </div>
                  </div>
                  <div className="min-w-[180px] rounded-[24px] bg-white p-5 shadow-soft">
                    <div className="text-xs font-bold uppercase tracking-[0.22em] text-slate-400">Completion</div>
                    <div className="display-font mt-2 text-4xl font-800 text-ink">{status.progressPct}%</div>
                    <div className="mt-3"><ProgressBar value={status.progressPct} /></div>
                  </div>
                </div>
              </div>
            </Reveal>

            <div className="module-flow space-y-0">
              {visibleModules.length === 0 ? (
                <EmptyState title="No visible modules" text="No module has been targeted to this learner profile yet." />
              ) : visibleModules.map((module, index) => (
                <ModuleLearningCard
                  key={module.id}
                  module={module}
                  course={course}
                  index={index}
                  total={visibleModules.length}
                  user={user}
                  progress={progress}
                  quizzes={quizzes}
                  quizAttempts={quizAttempts}
                  setOpenQuiz={setOpenQuiz}
                />
              ))}
            </div>

            <Reveal>
              <div className="rounded-[28px] border border-slate-100 bg-gradient-to-br from-amber-50 via-white to-teal-50 p-6 shadow-soft md:p-8">
                <div className="flex flex-col gap-5 lg:flex-row lg:items-center lg:justify-between">
                  <div>
                    <div className="text-[11px] font-bold uppercase tracking-[0.32em] text-amberish">Final Step</div>
                    <h3 className="display-font mt-2 text-2xl font-800 text-ink md:text-3xl">Course Quiz</h3>
                    <p className="mt-2 max-w-2xl text-sm leading-7 text-slate-600">Complete the course quiz to finalize training clearance and unlock your certificate.</p>
                  </div>
                  {courseQuiz ? (
                    <Button tone="accent" onClick={() => setOpenQuiz(courseQuiz)}>
                      {status.courseQuizPassed ? 'Review Course Quiz' : 'Take Course Quiz'}
                    </Button>
                  ) : <Tag tone="green">No course quiz required</Tag>}
                </div>
              </div>
            </Reveal>
          </div>
          {openQuiz && (
            <QuizPlayer
              user={user}
              quiz={openQuiz}
              quizAttempts={quizAttempts}
              setQuizAttempts={setQuizAttempts}
              onClose={() => setOpenQuiz(null)}
              course={course}
              modules={modules}
              assignments={assignments}
              progress={progress}
              quizzes={quizzes}
            />
          )}
        </>
      );

    const CourseDetailPage = ({ user, course, modules, quizzes, assignments, progress, setProgress, quizAttempts, setQuizAttempts }) => (
      <div className="page-shell min-h-screen">
        <div className="mx-auto max-w-[1320px] px-4 py-8 md:px-6">
          <SectionTitle
            title={course.title}
            subtitle={`${course.type} • ${course.trainingType} • ${course.focusArea}`}

          <CourseDetailContent
