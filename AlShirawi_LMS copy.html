    const QuizManagement = ({ courses, modules, quizzes, setQuizzes }) => {
      const blankQuestion = () => ({ id: uid(), text: '', options: ['', '', '', ''], answer: 0 });
      const blankQuiz = {
        title: '',
        scopeType: 'course',
        scopeId: courses[0]?.id || '',
        passMark: 80,
        maxAttempts: 3,
        questions: [blankQuestion()],
      };
      const [editing, setEditing] = useState(null);
      const [form, setForm] = useState(blankQuiz);
      const [error, setError] = useState('');

      useEffect(() => {
        if (!editing) {
          setForm((prev) => ({ ...prev, scopeId: prev.scopeType === 'course' ? (courses[0]?.id || '') : (modules[0]?.id || '') }));
        }
      }, [courses.length, modules.length]);

      const openNew = () => {
        setEditing({});
        setForm({
          title: '',
          scopeType: 'course',
          scopeId: courses[0]?.id || '',
          passMark: 80,
          maxAttempts: 3,
          questions: [blankQuestion()],
        });
        setError('');
      };

      const openEdit = (quiz) => {
        setEditing(quiz);
        setForm({ ...quiz, questions: quiz.questions && quiz.questions.length ? quiz.questions : [blankQuestion()] });
        setError('');
      };

      const updateQuestion = (index, field, value) => {
        setForm((prev) => ({
          ...prev,
          questions: prev.questions.map((question, idx) => idx === index ? { ...question, [field]: value } : question),
        }));
      };

      const updateOption = (questionIndex, optionIndex, value) => {
        setForm((prev) => ({
          ...prev,
          questions: prev.questions.map((question, idx) => idx === questionIndex ? {
            ...question,
            options: question.options.map((option, optIdx) => optIdx === optionIndex ? value : option),
          } : question),
        }));
      };

      const save = () => {
        if (!clean(form.title, 140) || !form.scopeId) {
          setError('Enter a quiz title and choose the related course or module.');
          return;
        }
        if (form.questions.some((question) => !clean(question.text, 300) || question.options.some((option) => !clean(option, 180)))) {
          setError('Complete every question and every option.');
          return;
        }
        const payload = {
          id: editing.id || uid(),
          title: clean(form.title, 140),
          scopeType: form.scopeType,
          scopeId: form.scopeId,
          passMark: Number(form.passMark) || 80,
          maxAttempts: Number(form.maxAttempts) || 3,
          questions: form.questions.map((question) => ({
            ...question,
            text: clean(question.text, 300),
            options: question.options.map((option) => clean(option, 180)),
          })),
          createdAt: editing.createdAt || Date.now(),
        };
        const next = editing.id ? quizzes.map((quiz) => quiz.id === editing.id ? payload : quiz) : [...quizzes, payload];
        setQuizzes(next);
        setEditing(null);
      };

      const remove = (id) => {
        if (!window.confirm('Delete this quiz?')) return;
        setQuizzes(quizzes.filter((quiz) => quiz.id !== id));
      };

      const scopeLabel = (quiz) => {
        if (quiz.scopeType === 'course') return courses.find((course) => course.id === quiz.scopeId)?.title || 'Deleted course';
        return modules.find((module) => module.id === quiz.scopeId)?.title || 'Deleted module';
      };

      return (
        <div className="space-y-6">
          <SectionTitle
            title="Quiz Management"
            subtitle="Create quizzes after either a full course or an individual module, with pass marks and limited attempts."
            action={<Button onClick={openNew}>Create Quiz</Button>}
          />
          <Panel className="overflow-hidden">
            {quizzes.length === 0 ? (
              <div className="p-6"><EmptyState title="No quizzes created" text="Add a course quiz or module quiz." /></div>
            ) : (
              <div className="table-wrap overflow-x-auto">
                <table>
                  <thead>
                    <tr className="text-left text-xs font-bold uppercase tracking-[0.18em] text-slate-500">
                      <th className="px-5 py-4">Quiz</th>
                      <th className="px-5 py-4">Scope</th>
                      <th className="px-5 py-4">Questions</th>
                      <th className="px-5 py-4">Pass Mark</th>
                      <th className="px-5 py-4">Attempts</th>
                      <th className="px-5 py-4">Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    {quizzes.map((quiz) => (
                      <tr key={quiz.id} className="border-t border-slate-100 hover:bg-slate-50">
                        <td className="px-5 py-4 text-sm font-semibold text-ink">{quiz.title}</td>
                        <td className="px-5 py-4 text-sm text-slate-600">
                          <Tag tone={quiz.scopeType === 'course' ? 'blue' : 'teal'}>{quiz.scopeType === 'course' ? 'Course Quiz' : 'Module Quiz'}</Tag>
                          <div className="mt-2 text-xs text-slate-500">{scopeLabel(quiz)}</div>
                        </td>
                        <td className="px-5 py-4 text-sm text-slate-600">{quiz.questions.length}</td>
                        <td className="px-5 py-4"><Tag tone="amber">{quiz.passMark}%</Tag></td>
                        <td className="px-5 py-4 text-sm text-slate-600">{quiz.maxAttempts}</td>
                        <td className="px-5 py-4">
                          <div className="flex gap-2">
                            <Button variant="soft" onClick={() => openEdit(quiz)}>Edit</Button>
                            <Button variant="soft" tone="danger" onClick={() => remove(quiz.id)}>Delete</Button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </Panel>

          {editing && (
            <Modal
              title={editing.id ? 'Edit Quiz' : 'Create Quiz'}
              subtitle="Design the assessment that appears after a course or module."
              onClose={() => setEditing(null)}
              actions={
                <>
                  <Button variant="soft" tone="slate" onClick={() => setEditing(null)}>Cancel</Button>
                  <Button onClick={save}>Save Quiz</Button>
                </>
              }
              wide
            >
              <div className="grid gap-4 md:grid-cols-2">
                <TextInput label="Quiz Title" value={form.title} onChange={(value) => setForm((prev) => ({ ...prev, title: value }))} />
                <SelectInput
                  label="Quiz Scope"
                  value={form.scopeType}
                  onChange={(value) => setForm((prev) => ({
                    ...prev,
                    scopeType: value,
                    scopeId: value === 'course' ? (courses[0]?.id || '') : (modules[0]?.id || ''),
                  }))}
                  options={[
                    { value: 'course', label: 'After a Course' },
                    { value: 'module', label: 'After a Module' },
                  ]}
                />
                <SelectInput
                  label={form.scopeType === 'course' ? 'Course' : 'Module'}
                  value={form.scopeId}
                  onChange={(value) => setForm((prev) => ({ ...prev, scopeId: value }))}
                  options={(form.scopeType === 'course' ? courses : modules).map((item) => ({ value: item.id, label: item.title }))}
                />
                <TextInput label="Pass Mark (%)" value={String(form.passMark)} onChange={(value) => setForm((prev) => ({ ...prev, passMark: value }))} type="number" />
                <TextInput label="Max Attempts" value={String(form.maxAttempts)} onChange={(value) => setForm((prev) => ({ ...prev, maxAttempts: value }))} type="number" />
              </div>

              <Divider />

              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="display-font text-xl font-800 text-ink">Questions</h3>
                  <Button variant="soft" tone="secondary" onClick={() => setForm((prev) => ({ ...prev, questions: [...prev.questions, blankQuestion()] }))}>Add Question</Button>
                </div>
                {form.questions.map((question, index) => (
                  <div key={question.id} className="rounded-[24px] border border-slate-200 bg-slate-50 p-5">
                    <div className="mb-4 flex items-center justify-between gap-3">
                      <Tag tone="blue">Question {index + 1}</Tag>
                      {form.questions.length > 1 && <Button variant="soft" tone="danger" onClick={() => setForm((prev) => ({ ...prev, questions: prev.questions.filter((_, idx) => idx !== index) }))}>Remove</Button>}
                    </div>
                    <TextInput label="Question Text" value={question.text} onChange={(value) => updateQuestion(index, 'text', value)} />
                    <div className="mt-4 grid gap-3 md:grid-cols-2">
                      {question.options.map((option, optionIndex) => (
                        <label key={optionIndex} className={`rounded-2xl border px-4 py-3 text-sm ${question.answer === optionIndex ? 'border-blue-400 bg-blue-50' : 'border-slate-200 bg-white'}`}>
                          <div className="mb-2 flex items-center gap-2 font-semibold text-slate-700">
                            <input type="radio" checked={question.answer === optionIndex} onChange={() => updateQuestion(index, 'answer', optionIndex)} />
                            Correct Answer
                          </div>
                          <input
                            value={option}
                            onChange={(e) => updateOption(index, optionIndex, e.target.value)}
                            className="w-full rounded-xl border border-slate-200 px-3 py-2 outline-none focus:border-blue-400"
                            placeholder={`Option ${optionIndex + 1}`}
                          />
                        </label>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
              {error && <div className="mt-4 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{error}</div>}
            </Modal>
          )}
        </div>
      );
    };

    const AdminDashboard = ({ users, courses, assignments, modules, quizzes, progress, certificates }) => {
      const learners = users.filter((user) => user.role === 'learner');
      const admins = users.filter((user) => ['superadmin', 'admin'].includes(user.role));

            <div className="space-y-6">
              <Panel className="p-6">

                  </div>

              </Panel>

              <Panel className="p-6">
                <h2 className="display-font text-2xl font-800 text-ink">Prototype Flow</h2>
                <div className="mt-5 space-y-4">
                  {[
                    'Create an employee account from the login page with a company email.',

      return (
        <div className="space-y-6">
          <SectionTitle
            title="Reports"
            subtitle="A structured progress and performance view with assignments, completions, progress bars, and quiz performance."
          />
          {learners.length === 0 ? (
            <EmptyState title="No report data yet" text="Create learners and assign them courses to populate reports." />
          ) : (
            <div className="space-y-4">
              {learners.map((learner) => {
                const learnerAssignments = assignments.filter((item) => item.email === learner.email);
                const learnerCertificates = certificates.filter((item) => item.email === learner.email);
                const learnerAttempts = quizAttempts.filter((item) => item.email === learner.email);
                return (
                  <Panel key={learner.id} className="p-6">
                    <div className="flex flex-col gap-4 xl:flex-row xl:items-start xl:justify-between">
                      <div>
                        <h2 className="display-font text-2xl font-800 text-ink">{learner.name}</h2>
                        <p className="mt-1 text-sm text-slatey">{learner.designation} • {learner.department} • {businessLineLabel(learner)}</p>
                      </div>
                      <div className="flex flex-wrap gap-2">
                        <Tag tone="blue">{learnerAssignments.length} Assigned</Tag>
                        <Tag tone="green">{learnerCertificates.length} Completed</Tag>
                        <Tag tone="teal">{learnerAttempts.filter((item) => item.passed).length} Passed Quizzes</Tag>
                      </div>
                    </div>
                    <div className="mt-6 grid gap-4 xl:grid-cols-2">
                      {learnerAssignments.length === 0 ? (
                        <div className="rounded-[22px] border border-slate-100 bg-slate-50 p-5 text-sm text-slatey">No assigned courses yet.</div>
                      ) : learnerAssignments.map((assignment) => {

                          (item.scopeType === 'module' && status.visibleModules.some((module) => module.id === item.scopeId))
                        ));
                        const bestScore = relatedAttempts.length ? Math.max(...relatedAttempts.map((item) => item.score)) : null;
                        return (

                                  <Tag tone="blue">{course.trainingType}</Tag>
                                  <Tag tone="slate">{status.pendingLabel}</Tag>

                              </div>
                              <div className="min-w-[120px] text-right">
                                <div className="display-font text-2xl font-800 text-ink">{status.progressPct}%</div>

                              </div>

                              <div>Quiz Best: <span className="font-semibold text-ink">{bestScore !== null ? `${bestScore}%` : '—'}</span></div>
                              <div>Due: <span className="font-semibold text-ink">{fmtDate(assignment.dueDate)}</span></div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </Panel>
                );
              })}
            </div>
          )}
        </div>
      );
    };

    const QuizPlayer = ({ user, quiz, quizAttempts, setQuizAttempts, onClose }) => {
      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);
      const [score, setScore] = useState(0);
      const attempts = quizAttempts.filter((item) => item.email === user.email && item.quizId === quiz.id);
      const alreadyPassed = attempts.some((item) => item.passed);
      const attemptsLeft = quiz.maxAttempts - attempts.length;

      const submit = () => {
        if (Object.keys(answers).length !== quiz.questions.length) return;
        let correct = 0;
        quiz.questions.forEach((question, index) => {
          if (answers[index] === question.answer) correct += 1;
        });
        const result = Math.round((correct / quiz.questions.length) * 100);
        const passed = result >= quiz.passMark;
        setScore(result);
        setSubmitted(true);
        setQuizAttempts([
          ...quizAttempts,
          {
            id: uid(),
            email: user.email,
            quizId: quiz.id,
            scopeType: quiz.scopeType,
            scopeId: quiz.scopeId,
            score: result,
            passed,
            takenAt: Date.now(),
          },
        ]);
      };

      return (
        <Modal
          title={quiz.title}
          subtitle={`${quiz.questions.length} questions • Pass mark ${quiz.passMark}% • Attempts left ${Math.max(attemptsLeft, 0)}`}
          onClose={onClose}
          actions={
            submitted
              ? <Button onClick={onClose}>{score >= quiz.passMark ? 'Return to Course' : 'Close'}</Button>
              : <Button onClick={submit} disabled={alreadyPassed || attemptsLeft <= 0}>Submit Quiz</Button>
          }
          wide
        >
          {alreadyPassed ? (
            <div className="rounded-[24px] border border-emerald-200 bg-emerald-50 p-6 text-sm text-emerald-800">
              You already passed this quiz. No further attempt is required.
            </div>
          ) : attemptsLeft <= 0 && !submitted ? (
            <div className="rounded-[24px] border border-red-200 bg-red-50 p-6 text-sm text-red-700">
              Maximum attempts reached. Contact admin if you need a reset.
            </div>
          ) : submitted ? (
            <div className="space-y-4">
              <div className={`rounded-[24px] p-6 text-center ${score >= quiz.passMark ? 'bg-emerald-50 text-emerald-800' : 'bg-red-50 text-red-700'}`}>
                <div className="display-font text-5xl font-800">{score}%</div>
                <div className="mt-2 text-base font-semibold">{score >= quiz.passMark ? 'Passed' : 'Not Yet Passed'}</div>
              </div>
              {quiz.questions.map((question, index) => (
                <div key={question.id} className={`rounded-[24px] border p-5 ${answers[index] === question.answer ? 'border-emerald-200 bg-emerald-50' : 'border-red-200 bg-red-50'}`}>
                  <div className="font-semibold text-ink">{question.text}</div>
                  <div className="mt-3 text-sm">Your answer: <span className="font-semibold">{question.options[answers[index]] || '—'}</span></div>
                  {answers[index] !== question.answer && <div className="mt-2 text-sm">Correct answer: <span className="font-semibold">{question.options[question.answer]}</span></div>}
                </div>
              ))}
            </div>
          ) : (
            <div className="space-y-4">
              {quiz.questions.map((question, index) => (
                <div key={question.id} className="rounded-[24px] border border-slate-200 bg-slate-50 p-5">
                  <div className="display-font text-lg font-800 text-ink">Q{index + 1}. {question.text}</div>
                  <div className="mt-4 grid gap-3">
                    {question.options.map((option, optionIndex) => (
                      <label key={optionIndex} className={`flex cursor-pointer items-center gap-3 rounded-2xl border px-4 py-3 text-sm ${answers[index] === optionIndex ? 'border-blue-400 bg-blue-50' : 'border-slate-200 bg-white hover:bg-slate-50'}`}>
                        <input type="radio" checked={answers[index] === optionIndex} onChange={() => setAnswers((prev) => ({ ...prev, [index]: optionIndex }))} />
                        <span>{option}</span>
                      </label>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          )}
        </Modal>
      );
    };

    const CourseDetailContent = ({ user, course, modules, quizzes, assignments, progress, setProgress, quizAttempts, setQuizAttempts }) => {
      const visibleModules = getVisibleModulesForUser(modules, course.id, user);
      const [openQuiz, setOpenQuiz] = useState(null);
      const moduleQuizFor = (moduleId) => quizzes.find((quiz) => quiz.scopeType === 'module' && quiz.scopeId === moduleId);
      const courseQuiz = quizzes.find((quiz) => quiz.scopeType === 'course' && quiz.scopeId === course.id);
      const status = courseStatusForUser({ user, course, modules, assignments, progress, quizzes, quizAttempts });

      const completeModule = (module) => {
        const exists = progress.some((entry) => entry.email === user.email && entry.moduleId === module.id);
        if (exists) return;
        setProgress([
          ...progress,
          {
            id: uid(),
            email: user.email,
            courseId: course.id,
            moduleId: module.id,
            completedAt: Date.now(),
          },
        ]);
      };

      return (
        <>
          <div className="space-y-6">
              <div className="rounded-[24px] border border-slate-100 bg-slate-50 p-6">
                <div className="flex flex-wrap items-center justify-between gap-4">
                  <div>
                    <div className="flex flex-wrap gap-2">
                      <Tag tone={course.type === 'Essential' ? 'amber' : 'teal'}>{course.type}</Tag>
                      <Tag tone="blue">{course.trainingType}</Tag>
                      <Tag tone="slate">{course.focusArea}</Tag>
                    </div>
                    <p className="mt-4 text-sm leading-7 text-slatey">{course.description || 'No course description added yet.'}</p>
                  </div>
                  <div className="min-w-[180px] rounded-[24px] bg-white p-5 shadow-soft">
                    <div className="text-sm font-semibold text-slate-500">Completion</div>
                    <div className="display-font mt-2 text-4xl font-800 text-ink">{status.progressPct}%</div>
                    <div className="mt-3"><ProgressBar value={status.progressPct} /></div>
                  </div>
                </div>
              </div>

              <div>
                <h3 className="display-font text-2xl font-800 text-ink">Modules</h3>
                <div className="mt-4 space-y-4">
                  {visibleModules.length === 0 ? (
                    <EmptyState title="No visible modules" text="No module has been targeted to this learner profile yet." />
                  ) : visibleModules.map((module) => {
                    const done = progress.some((entry) => entry.email === user.email && entry.moduleId === module.id);
                    const moduleQuiz = moduleQuizFor(module.id);
                    const moduleQuizPassed = moduleQuiz ? hasPassedQuiz(quizAttempts, user.email, moduleQuiz.id) : true;
                    return (
                      <div key={module.id} className="rounded-[24px] border border-slate-100 bg-white p-5 shadow-soft">
                        <div className="flex flex-col gap-4 xl:flex-row xl:items-start xl:justify-between">
                          <div className="max-w-4xl">
                            <div className="mb-3 flex flex-wrap gap-2">
                              <Tag tone="blue">Module {module.order}</Tag>
                              {done ? <Tag tone="green">Completed</Tag> : <Tag tone="slate">Pending</Tag>}
                              {moduleQuiz && <Tag tone={moduleQuizPassed ? 'green' : 'amber'}>{moduleQuizPassed ? 'Quiz Passed' : 'Quiz Pending'}</Tag>}
                            </div>
                            <h4 className="display-font text-xl font-800 text-ink">{module.title}</h4>
                            <p className="mt-2 text-sm leading-6 text-slatey">{module.description || 'No description provided.'}</p>
                          </div>
                          <div className="flex flex-wrap gap-3">
                            {!done && <Button variant="soft" onClick={() => completeModule(module)}>Mark Complete</Button>}
                            {moduleQuiz && <Button tone="secondary" onClick={() => setOpenQuiz(moduleQuiz)}>{moduleQuizPassed ? 'View Quiz' : 'Take Quiz'}</Button>}
                          </div>
                        </div>

                        {module.videoUrl && (
                          <div className="mt-5 overflow-hidden rounded-[24px] border border-slate-200">
                            <div className="aspect-video w-full bg-slate-950">
                              {isDirectVideoFile(module.videoUrl) ? (
                                <video src={module.videoUrl} className="h-full w-full" controls preload="metadata" />
                              ) : (
                                <iframe src={getEmbeddableVideoUrl(module.videoUrl)} title={module.title} className="h-full w-full" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen />
                              )}
                            </div>
                            {!isDirectVideoFile(module.videoUrl) && getEmbeddableVideoUrl(module.videoUrl) === module.videoUrl && !module.videoUrl.includes('/embed/') && (
                              <div className="border-t border-slate-200 bg-white px-4 py-3 text-xs text-slate-500">
                                If this video does not preview, use an embeddable video link or direct video file.
                              </div>
                            )}
                          </div>
                        )}

                        <div className="mt-5 grid gap-5 lg:grid-cols-2">
                          <div className="rounded-[22px] bg-slate-50 p-4">
                            <div className="mb-2 text-xs font-bold uppercase tracking-[0.22em] text-slate-400">Transcript</div>
                            <div className="max-h-56 overflow-y-auto whitespace-pre-wrap text-sm leading-6 text-slate-700">{module.transcript || 'No transcript available.'}</div>
                          </div>
                          <div className="rounded-[22px] bg-blue-50 p-4">
                            <div className="mb-2 text-xs font-bold uppercase tracking-[0.22em] text-blue-400">Notes / Guidance</div>
                            <div className="whitespace-pre-wrap text-sm leading-6 text-slate-700">{module.notes || 'No notes available.'}</div>
                          </div>
                        </div>

                        {(module.documents || []).length > 0 && (
                          <div className="mt-5">
                            <div className="mb-3 text-sm font-semibold text-slate-700">Documents</div>
                            <div className="flex flex-wrap gap-3">
                              {module.documents.map((file) => (
                                <a key={file.id} href={file.dataUrl} download={file.name} className="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-100">
                                  {file.name}
                                </a>
                              ))}
                            </div>
                          </div>
                        )}

                        {(module.images || []).length > 0 && (
                          <div className="mt-5">
                            <div className="mb-3 text-sm font-semibold text-slate-700">Pictures / Images</div>
                            <div className="overflow-x-auto">
                              <div className="flex gap-4 pb-2">
                              {module.images.map((file) => (
                                <div key={file.id} className="min-w-[260px] overflow-hidden rounded-[22px] border border-slate-100 bg-slate-50">
                                  <img src={file.dataUrl} alt={file.label || file.name} className="h-40 w-full object-cover" />
                                  <div className="px-4 py-3">
                                    <div className="text-sm font-semibold text-slate-700">{file.label || file.name}</div>
                                    <div className="mt-1 text-xs text-slate-400">{file.name}</div>
                                  </div>
                                </div>
                              ))}
                              </div>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="rounded-[24px] border border-slate-100 bg-slate-50 p-6">
                <div className="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
                  <div>
                    <h3 className="display-font text-2xl font-800 text-ink">Course Quiz</h3>
                    <p className="mt-2 text-sm text-slatey">Complete the course quiz to finalize training clearance where applicable.</p>
                  </div>
                  {courseQuiz ? (
                    <Button tone="secondary" onClick={() => setOpenQuiz(courseQuiz)}>
                      {status.courseQuizPassed ? 'View Course Quiz' : 'Take Course Quiz'}
                    </Button>
                  ) : <Tag tone="green">No course quiz required</Tag>}
                </div>
              </div>
            </div>
          {openQuiz && <QuizPlayer user={user} quiz={openQuiz} quizAttempts={quizAttempts} setQuizAttempts={setQuizAttempts} onClose={() => setOpenQuiz(null)} />}
        </>
      );
    };

    const CourseDetailModal = ({ user, course, modules, quizzes, assignments, progress, setProgress, quizAttempts, setQuizAttempts, onClose }) => (
      <Modal
        title={course.title}
        subtitle={`${course.type} • ${course.trainingType} • ${course.focusArea}`}
        onClose={onClose}
        wide
      >
        <CourseDetailContent
          user={user}
          course={course}
          modules={modules}
          quizzes={quizzes}
          assignments={assignments}
          progress={progress}
          setProgress={setProgress}
          quizAttempts={quizAttempts}
          setQuizAttempts={setQuizAttempts}
        />
      </Modal>
    );

    const CourseDetailPage = ({ user, course, modules, quizzes, assignments, progress, setProgress, quizAttempts, setQuizAttempts }) => (
      <div className="page-shell min-h-screen">
        <div className="mx-auto max-w-[1320px] px-4 py-8 md:px-6">
          <SectionTitle
            title={course.title}
            subtitle={`${course.type} • ${course.trainingType} • ${course.focusArea}`}
            action={<Button variant="soft" tone="slate" onClick={() => window.close()}>Close Tab</Button>}
          />
          <CourseDetailContent
            user={user}
            course={course}
            modules={modules}
            quizzes={quizzes}
            assignments={assignments}
            progress={progress}
            setProgress={setProgress}
            quizAttempts={quizAttempts}
            setQuizAttempts={setQuizAttempts}
          />
        </div>
      </div>
    );

    const LearnerDashboard = ({ user, courses, assignments, modules, quizzes, progress, quizAttempts, certificates, onOpenCourse }) => {
      const myAssignments = assignments.filter((item) => item.email === user.email);
      const statuses = myAssignments.map((assignment) => {
        const course = courses.find((item) => item.id === assignment.courseId);
        if (!course) return null;
        return { assignment, course, status: courseStatusForUser({ user, course, modules, assignments, progress, quizzes, quizAttempts }) };
      }).filter(Boolean);
      const completed = statuses.filter((item) => item.status.completed).length;
      const essential = statuses.filter((item) => item.course.type === 'Essential');
      const desirable = statuses.filter((item) => item.course.type === 'Desirable');
      const progressPct = statuses.length ? Math.round(statuses.reduce((sum, item) => sum + item.status.progressPct, 0) / statuses.length) : 0;
      const bestQuizScore = quizAttempts.filter((item) => item.email === user.email).length
        ? Math.max(...quizAttempts.filter((item) => item.email === user.email).map((item) => item.score))
        : null;

      return (
        <div className="space-y-6">
          <SectionTitle
            title={`Welcome, ${user.name}`}
            subtitle={`${user.designation} • ${user.department} • ${businessLineLabel(user)}`}
          />
          <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
            <StatCard label="Assigned Learning" value={statuses.length} />
            <StatCard label="Completed Courses" value={completed} tone="teal" />
            <StatCard label="Overall Progress" value={`${progressPct}%`} tone="amber" />
            <StatCard label="Best Quiz Score" value={bestQuizScore !== null ? `${bestQuizScore}%` : '—'} tone="slate" />
          </div>
          <div className="grid gap-6 xl:grid-cols-[1.1fr_0.9fr]">
            <Panel className="p-6">
              <div className="flex items-center justify-between gap-4">
                <div>
                  <h2 className="display-font text-2xl font-800 text-ink">Assigned Learning</h2>
                  <p className="mt-2 text-sm text-slatey">Only the courses assigned to this learner appear here.</p>
                </div>
                <Tag tone="blue">{statuses.length} Courses</Tag>
              </div>
              <div className="mt-5 space-y-4">
                {statuses.length === 0 ? (
                  <EmptyState title="Nothing assigned yet" text="Your HR and admin teams have not assigned any courses yet." />
                ) : statuses.map(({ assignment, course, status }) => (
                  <div key={assignment.id} className="rounded-[24px] border border-slate-100 bg-slate-50 p-5">
                    <div className="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
                      <div>
                        <div className="mb-3 flex flex-wrap gap-2">
                          <Tag tone={course.type === 'Essential' ? 'amber' : 'teal'}>{course.type}</Tag>
                          <Tag tone="blue">{course.trainingType}</Tag>
                          <Tag tone={status.completed ? 'green' : 'slate'}>{status.pendingLabel}</Tag>
                        </div>
                        <h3 className="display-font text-xl font-800 text-ink">{course.title}</h3>
                        <p className="mt-2 text-sm leading-6 text-slatey">{course.description || 'No description available.'}</p>
                      </div>
                      <div className="min-w-[140px]">
                        <div className="text-right text-sm text-slate-500">Due {fmtDate(assignment.dueDate)}</div>
                        <div className="mt-3"><ProgressBar value={status.progressPct} /></div>
                        <div className="mt-2 text-right text-xs text-slate-500">{status.completedModules}/{status.moduleCount} modules</div>
                      </div>
                    </div>
                    <div className="mt-5">
                      <Button onClick={() => onOpenCourse(course.id)}>Open Course</Button>
                    </div>
                  </div>
                ))}
              </div>
            </Panel>

            <div className="space-y-6">
              <Panel className="p-6">
                <h2 className="display-font text-2xl font-800 text-ink">Learning Mix</h2>
                <div className="mt-5 grid gap-4 sm:grid-cols-2">
                  <div className="rounded-[22px] bg-amber-50 p-5">
                    <div className="text-sm font-semibold text-amberish">Essential</div>
                    <div className="display-font mt-2 text-4xl font-800 text-amberish">{essential.length}</div>
                  </div>
                  <div className="rounded-[22px] bg-teal-50 p-5">
                    <div className="text-sm font-semibold text-tealish">Desirable</div>
                    <div className="display-font mt-2 text-4xl font-800 text-tealish">{desirable.length}</div>
                  </div>
                </div>
              </Panel>
              <Panel className="p-6">
                <h2 className="display-font text-2xl font-800 text-ink">Recognition</h2>
                <p className="mt-2 text-sm text-slatey">Badges and certificates unlock automatically after course completion.</p>
                <div className="mt-5 grid gap-3">
                  {certificates.filter((item) => item.email === user.email).length === 0 ? (
                    <div className="rounded-[22px] bg-slate-50 p-5 text-sm text-slatey">Complete your assigned learning to unlock badges and certificates.</div>
                  ) : certificates.filter((item) => item.email === user.email).map((item) => (
                    <div key={item.id} className="rounded-[22px] bg-emerald-50 p-5">
                      <div className="display-font text-lg font-800 text-emerald-800">{item.badgeTitle}</div>
                      <div className="mt-1 text-sm text-emerald-700">Certificate issued on {fmtDate(item.issuedAt)}</div>
                    </div>
                  ))}
                </div>
              </Panel>
            </div>
          </div>
        </div>
      );
    };

    const LearnerCourses = ({ user, courses, assignments, modules, quizzes, progress, quizAttempts, onOpenCourse }) => {
      const myAssignments = assignments.filter((item) => item.email === user.email);
      const cards = myAssignments.map((assignment) => {
        const course = courses.find((item) => item.id === assignment.courseId);
        if (!course) return null;
        return { assignment, course, status: courseStatusForUser({ user, course, modules, assignments, progress, quizzes, quizAttempts }) };
      }).filter(Boolean);

      return (
        <div className="space-y-6">
          <SectionTitle title="My Courses" subtitle="Assigned learning, grouped by requirement type, with module completion and quiz visibility." />
          {cards.length === 0 ? (
            <EmptyState title="No assigned courses" text="Your assigned learning will appear here once admin creates an assignment." />
          ) : (
            <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
              {cards.map(({ assignment, course, status }) => (
                <Panel key={assignment.id} className="p-6">
                  <div className="flex flex-wrap gap-2">
                    <Tag tone={course.type === 'Essential' ? 'amber' : 'teal'}>{course.type}</Tag>
                    <Tag tone="blue">{course.trainingType}</Tag>
                    <Tag tone="slate">{course.focusArea}</Tag>
                  </div>
                  <h3 className="display-font mt-4 text-2xl font-800 text-ink">{course.title}</h3>
                  <p className="mt-3 text-sm leading-6 text-slatey">{course.description || 'No description available.'}</p>
                  <div className="mt-5">
                    <ProgressBar value={status.progressPct} />
                    <div className="mt-2 flex items-center justify-between text-xs text-slate-500">
                      <span>{status.completedModules}/{status.moduleCount} modules completed</span>
                      <span>{status.progressPct}%</span>
                    </div>
                  </div>
                  <div className="mt-4 flex flex-wrap gap-2">
                    <Tag tone={status.completed ? 'green' : 'amber'}>{status.pendingLabel}</Tag>
                    <Tag tone="slate">Due {fmtDate(assignment.dueDate)}</Tag>
                  </div>
                  <div className="mt-6">
                    <Button onClick={() => onOpenCourse(course.id)}>Open Learning</Button>
                  </div>
                </Panel>
              ))}
            </div>
          )}
        </div>
      );
    };

    const LearnerProgress = ({ user, courses, assignments, modules, quizzes, progress, quizAttempts, certificates }) => {
      const myAssignments = assignments.filter((item) => item.email === user.email);

      return (
        <div className="space-y-6">
          <SectionTitle title="Progress / Grades / Clearance" subtitle="Track module completion, progress percentage, quiz results, and final course clearance." />
          {myAssignments.length === 0 ? (
            <EmptyState title="No progress to show" text="Assigned courses will populate your progress and grades view." />
          ) : (
            <div className="space-y-4">
              {myAssignments.map((assignment) => {
                const course = courses.find((item) => item.id === assignment.courseId);
                if (!course) return null;
                const status = courseStatusForUser({ user, course, modules, assignments, progress, quizzes, quizAttempts });
                const relatedAttempts = quizAttempts.filter((item) => item.email === user.email && (
                  (item.scopeType === 'course' && item.scopeId === course.id) ||
                  (item.scopeType === 'module' && status.visibleModules.some((module) => module.id === item.scopeId))
                ));
                const bestScore = relatedAttempts.length ? Math.max(...relatedAttempts.map((item) => item.score)) : null;
                const certificate = certificates.find((item) => item.email === user.email && item.courseId === course.id);
                return (
                  <Panel key={assignment.id} className="p-6">
                    <div className="flex flex-col gap-4 xl:flex-row xl:items-start xl:justify-between">
                      <div>
                        <div className="mb-3 flex flex-wrap gap-2">
                          <Tag tone={course.type === 'Essential' ? 'amber' : 'teal'}>{course.type}</Tag>
                          <Tag tone="blue">{course.trainingType}</Tag>
                          <Tag tone={status.completed ? 'green' : 'slate'}>{status.pendingLabel}</Tag>
                        </div>
                        <h3 className="display-font text-2xl font-800 text-ink">{course.title}</h3>
                        <p className="mt-2 text-sm text-slatey">Focus: {course.focusArea}</p>
                      </div>
                      <div className="rounded-[22px] bg-slate-50 p-5 text-right">
                        <div className="display-font text-4xl font-800 text-ink">{status.progressPct}%</div>
                        <div className="mt-1 text-xs text-slate-500">Completion Progress</div>
                      </div>
                    </div>
                    <div className="mt-5">
                      <ProgressBar value={status.progressPct} />
                    </div>
                    <div className="mt-5 grid gap-4 md:grid-cols-2 xl:grid-cols-4">
                      <div className="rounded-[20px] bg-slate-50 p-4">
                        <div className="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Modules</div>
                        <div className="mt-2 text-lg font-semibold text-ink">{status.completedModules}/{status.moduleCount}</div>
                      </div>
                      <div className="rounded-[20px] bg-slate-50 p-4">
                        <div className="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Quiz Best</div>
                        <div className="mt-2 text-lg font-semibold text-ink">{bestScore !== null ? `${bestScore}%` : '—'}</div>
                      </div>
                      <div className="rounded-[20px] bg-slate-50 p-4">
                        <div className="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Clearance</div>
                        <div className="mt-2 text-lg font-semibold text-ink">{status.completed ? 'Cleared' : 'Pending'}</div>
                      </div>
                      <div className="rounded-[20px] bg-slate-50 p-4">
                        <div className="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Certificate</div>
                        <div className="mt-2 text-lg font-semibold text-ink">{certificate ? 'Issued' : 'Not yet'}</div>
                      </div>
                    </div>
                  </Panel>
                );
              })}
            </div>
          )}
        </div>
      );
    };

    const RecognitionHub = ({ viewer, courses, certificates }) => {
      const visibleCertificates = ['superadmin', 'admin', 'hr'].includes(viewer.role)
        ? certificates
        : certificates.filter((item) => item.email === viewer.email);

      return (
        <div className="space-y-6">
          <SectionTitle
            title="Certificates & Badges"
            subtitle="Recognition is automatically awarded after successful completion. Certificate cards also show the simulated email delivery status."
          />
          {visibleCertificates.length === 0 ? (
            <EmptyState title="No certificates issued yet" text="Complete training to unlock badges and generate downloadable certificates." />
          ) : (
            <div className="grid gap-4 xl:grid-cols-2">
              {visibleCertificates.map((certificate) => {
                const learnerName = certificate.learnerName;
                const course = courses.find((item) => item.id === certificate.courseId);
                return (
                  <Panel key={certificate.id} className="certificate-bg overflow-hidden">
                    <div className="h-2 bg-gradient-to-r from-brand via-tealish to-amberish" />
                    <div className="p-6">
                      <div className="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
                        <div>
                          <div className="flex flex-wrap gap-2">
                            <Tag tone="green">Badge Awarded</Tag>
                            <Tag tone="blue">Certificate Ready</Tag>
                          </div>
                          <h3 className="display-font mt-4 text-2xl font-800 text-ink">{certificate.badgeTitle}</h3>
                          <p className="mt-2 text-sm text-slatey">{learnerName} successfully completed {course?.title || 'this course'}.</p>
                        </div>
                        <div className="rounded-[22px] bg-white p-4 shadow-soft">
                          <div className="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Issued</div>
                          <div className="mt-2 text-sm font-semibold text-ink">{fmtDate(certificate.issuedAt)}</div>
                        </div>
                      </div>
                      <div className="mt-6 grid gap-4 md:grid-cols-2">
                        <div className="rounded-[22px] bg-white p-5 shadow-soft">
                          <div className="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Certificate Delivery</div>
                          <div className="mt-2 text-sm font-semibold text-ink">{certificate.emailStatus}</div>
                          <div className="mt-2 text-sm text-slatey">Sent to {certificate.email}</div>
                        </div>
                        <div className="rounded-[22px] bg-white p-5 shadow-soft">
                          <div className="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Recognition Note</div>
                          <div className="mt-2 text-sm text-slatey">This learner has completed the orientation or training course and earned the associated LMS badge.</div>
                        </div>
                      </div>
                      <div className="mt-6 flex flex-wrap gap-3">
                        <Button onClick={() => createPdfCertificate({ learner: { name: certificate.learnerName, employeeId: certificate.employeeId, email: certificate.email }, course: course || { title: certificate.courseTitle }, certificate })}>
                          Download PDF Certificate
                        </Button>
                        <Tag tone="teal">{certificate.courseType}</Tag>
                      </div>
                    </div>
                  </Panel>
                );
              })}
            </div>
          )}
        </div>
      );
    };

    const ProfilePage = ({ user }) => (
      <div className="space-y-6">
        <SectionTitle title="Profile" subtitle="Your employee profile and LMS access details." />
        <div className="grid gap-6 xl:grid-cols-[0.9fr_1.1fr]">
          <Panel className="p-8 text-center">
            <div className="mx-auto flex h-24 w-24 items-center justify-center rounded-[28px] bg-gradient-to-br from-brand to-tealish text-3xl font-bold text-white shadow-soft">
              {(user.name || '?')[0].toUpperCase()}
            </div>
            <h2 className="display-font mt-5 text-3xl font-800 text-ink">{user.name}</h2>
            <p className="mt-2 text-sm text-slatey">{user.email}</p>
            <div className="mt-4"><Tag tone={roleTone(user.role)}>{roleLabel(user.role)}</Tag></div>
          </Panel>
          <Panel className="p-8">
            <div className="grid gap-4 md:grid-cols-2">
              <div className="rounded-[22px] bg-slate-50 p-5"><div className="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Employee ID</div><div className="mt-2 text-lg font-semibold text-ink">{user.employeeId || '—'}</div></div>
              <div className="rounded-[22px] bg-slate-50 p-5"><div className="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Designation</div><div className="mt-2 text-lg font-semibold text-ink">{user.designation || '—'}</div></div>
              <div className="rounded-[22px] bg-slate-50 p-5"><div className="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Department</div><div className="mt-2 text-lg font-semibold text-ink">{user.department || '—'}</div></div>
              <div className="rounded-[22px] bg-slate-50 p-5"><div className="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Business Line</div><div className="mt-2 text-lg font-semibold text-ink">{businessLineLabel(user)}</div></div>
            </div>
            <div className="mt-5 rounded-[22px] bg-slate-50 p-5">
              <div className="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Employee Type</div>
              <div className="mt-3 flex flex-wrap gap-2">
                {(user.employeeTypes || []).length ? user.employeeTypes.map((type) => <Tag key={type} tone="blue">{type}</Tag>) : <Tag tone="slate">Not set</Tag>}
              </div>
            </div>
          </Panel>
        </div>
      </div>
    );

    const App = () => {
      const searchParams = new URLSearchParams(window.location.search);
      const standaloneCourseId = searchParams.get('courseView') === '1' ? searchParams.get('courseId') : '';
      const [sessionEmail, setSessionEmail] = useState(() => readSession());
      const [users, setUsers] = usePersistentState('users', []);
      const [courses, setCourses] = usePersistentState('courses', []);
      const [modules, setModules] = usePersistentState('modules', []);
      const [assignments, setAssignments] = usePersistentState('assignments', []);
      const [assignmentRules, setAssignmentRules] = usePersistentState('assignment_rules', []);
      const [quizzes, setQuizzes] = usePersistentState('quizzes', []);
      const [progress, setProgress] = usePersistentState('progress', []);
      const [quizAttempts, setQuizAttempts] = usePersistentState('quiz_attempts', []);
      const [certificates, setCertificates] = usePersistentState('certificates', []);
      const [view, setView] = useState('dashboard');
      const [navOpen, setNavOpen] = useState(false);

      useEffect(() => {
        const timer = setInterval(() => {
          const valid = readSession();
          if (!valid && sessionEmail) {
            setSessionEmail(null);
            setView('dashboard');
          }
        }, 60000);
        return () => clearInterval(timer);
      }, [sessionEmail]);

      useEffect(() => {
        const bootstrapExists = users.some((user) => user.email === SUPER_EMAIL);
        if (!bootstrapExists && sessionEmail === SUPER_EMAIL) {
          setUsers([
            ...users,
            {
              id: uid(),
              employeeId: 'ALS-ADM-001',
              name: slugName(SUPER_EMAIL),
              designation: 'LMS Super Admin',
              email: SUPER_EMAIL,
              department: 'Learning & Development',
              businessLine: BUSINESS_LINES[0],
              businessLineOther: '',
              employeeTypes: ['White-collar'],
              role: 'superadmin',
              createdAt: Date.now(),
              createdBy: 'system',
            },
          ]);
        }
      }, [sessionEmail, users]);

      useEffect(() => {
        if (!users.length) return;
        const nextCertificates = [...certificates];
        let changed = false;
        users.filter((user) => user.role === 'learner').forEach((user) => {
          courses.forEach((course) => {
            const status = courseStatusForUser({ user, course, modules, assignments, progress, quizzes, quizAttempts });
            if (!status.assigned || !status.completed) return;
            const existing = nextCertificates.find((item) => item.email === user.email && item.courseId === course.id);
            if (!existing) {
              nextCertificates.push({
                id: uid(),
                email: user.email,
                learnerName: user.name,
                employeeId: user.employeeId,
                courseId: course.id,
                courseTitle: course.title,
                courseType: course.type,
                badgeTitle: `${course.title} Completion Badge`,
                issuedAt: Date.now(),
                emailStatus: `Certificate sent to ${user.email}`,
              });
              changed = true;
            }
          });
        });
        if (changed) setCertificates(nextCertificates);
      }, [users, courses, modules, assignments, progress, quizzes, quizAttempts]);

      const login = (email) => {
        const existing = users.find((user) => user.email === email);
        if (!existing && email !== SUPER_EMAIL) {
          alert('This company email has not been created in the LMS yet. Use Create Account first.');
          return;
        }
        setSession(email);
        setSessionEmail(email);
      };

      const createAccount = (form) => {
        const email = clean(form.email, 120).toLowerCase();
        if (!clean(form.employeeId, 50) || !clean(form.name, 120) || !clean(form.designation, 120) || !clean(form.department, 120)) {
          return { ok: false, message: 'Complete all employee fields before creating the account.' };
        }
        if (!EMAIL_RE.test(email)) {
          return { ok: false, message: 'Employee email must use the @equipment.ae company format.' };
        }
        if ((form.employeeTypes || []).length === 0) {
          return { ok: false, message: 'Select at least one employee type.' };
        }
        if (form.businessLine === 'Other' && !clean(form.businessLineOther, 120)) {
          return { ok: false, message: 'Enter the business line name when selecting Other.' };
        }
        if (users.some((user) => user.email === email)) {
          return { ok: false, message: 'An account with this email already exists.' };
        }

        const user = {
          id: uid(),
          employeeId: clean(form.employeeId, 50),
          name: clean(form.name, 120),
          designation: clean(form.designation, 120),
          email,
          department: clean(form.department, 120),
          businessLine: form.businessLine,
          businessLineOther: form.businessLine === 'Other' ? clean(form.businessLineOther, 120) : '',
          employeeTypes: form.employeeTypes,
          role: 'learner',
          createdAt: Date.now(),
          createdBy: 'login-page',
        };

        const nextUsers = [...users, user];
        setUsers(nextUsers);

        const autoAssignments = assignmentRules
          .filter((rule) => ruleMatchesUser(rule, user))
          .filter((rule) => !assignments.some((item) => item.email === user.email && item.courseId === rule.courseId))
          .map((rule) => ({
            id: uid(),
            email: user.email,
            courseId: rule.courseId,
            dueDate: rule.dueDate || '',
            assignedAt: Date.now(),
            source: `Rule: ${rule.name}`,
          }));

        if (autoAssignments.length) {
          setAssignments([...assignments, ...autoAssignments]);
        }

        return { ok: true, message: `${user.name} was created successfully. You can sign in now.` };
      };

      const logout = () => {
        store.clear('session');
        setSessionEmail(null);
        setView('dashboard');
      };

      if (!sessionEmail) {
        return <LoginPage onLogin={login} onCreateAccount={createAccount} />;
      }

      const user = users.find((item) => item.email === sessionEmail);
      if (!user) {
        return <LoginPage onLogin={login} />;
      }

      const adminLike = ['superadmin', 'admin', 'hr'].includes(user.role);
      const openCourseInNewTab = (courseId) => {
        window.open(makeCourseTabUrl(courseId), '_blank', 'noopener');
      };
      const progressSummary = {
        quizAttemptsByUser: quizAttempts.reduce((acc, attempt) => {
          if (!acc[attempt.email]) acc[attempt.email] = [];
          acc[attempt.email].push(attempt);
          return acc;
        }, {}),
      };

      const renderView = () => {
        if (view === 'profile') return <ProfilePage user={user} />;
        if (adminLike) {
          if (view === 'dashboard') return <AdminDashboard users={users} courses={courses} assignments={assignments} modules={modules} quizzes={quizzes} progress={progressSummary} certificates={certificates} />;
          if (view === 'participants') return <ParticipantManagement users={users} setUsers={setUsers} currentUser={user} />;
          if (view === 'course-mgmt') return <CourseManagement courses={courses} setCourses={setCourses} />;
          if (view === 'module-mgmt') return <ModuleManagement courses={courses} modules={modules} setModules={setModules} />;
          if (view === 'assignment-mgmt') return <AssignmentManagement users={users} courses={courses} assignments={assignments} setAssignments={setAssignments} assignmentRules={assignmentRules} setAssignmentRules={setAssignmentRules} />;
          if (view === 'quiz-mgmt') return <QuizManagement courses={courses} modules={modules} quizzes={quizzes} setQuizzes={setQuizzes} />;
          if (view === 'reports') return <Reports users={users} courses={courses} assignments={assignments} modules={modules} quizzes={quizzes} quizAttempts={quizAttempts} progress={progress} certificates={certificates} />;
          if (view === 'recognition') return <RecognitionHub viewer={user} courses={courses} certificates={certificates} />;
        }
        if (view === 'dashboard') return <LearnerDashboard user={user} courses={courses} assignments={assignments} modules={modules} quizzes={quizzes} progress={progress} quizAttempts={quizAttempts} certificates={certificates} onOpenCourse={openCourseInNewTab} />;
        if (view === 'my-courses') return <LearnerCourses user={user} courses={courses} assignments={assignments} modules={modules} quizzes={quizzes} progress={progress} quizAttempts={quizAttempts} onOpenCourse={openCourseInNewTab} />;
        if (view === 'progress') return <LearnerProgress user={user} courses={courses} assignments={assignments} modules={modules} quizzes={quizzes} progress={progress} quizAttempts={quizAttempts} certificates={certificates} />;
        if (view === 'recognition') return <RecognitionHub viewer={user} courses={courses} certificates={certificates} />;
        return <ProfilePage user={user} />;
      };

      if (standaloneCourseId) {
        const standaloneCourse = courses.find((course) => course.id === standaloneCourseId);
        if (standaloneCourse) {
          return (
            <CourseDetailPage
              user={user}
              course={standaloneCourse}
              modules={modules}
              quizzes={quizzes}
              assignments={assignments}
              progress={progress}
              setProgress={setProgress}
              quizAttempts={quizAttempts}
              setQuizAttempts={setQuizAttempts}
            />
          );
        }
      }

      return (
        <div className="page-shell min-h-screen">
          <Header user={user} onToggleNav={() => setNavOpen((prev) => !prev)} onLogout={logout} onProfile={() => setView('profile')} />
          <div className="mx-auto flex max-w-[1600px] gap-6 px-4 py-6 md:px-6">
            <Sidebar role={user.role} view={view} setView={setView} open={navOpen} setOpen={setNavOpen} />
            <main className="min-w-0 flex-1">
              {renderView()}
            </main>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
